---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: agwc-config
  name: agwc-config
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agwc-config
    spec:
      restartPolicy: Never
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - args:
          - sh
          - -c
          - mkdir -p /var/opt/magma/configs && cp -f /configs/control_proxy.yml /var/opt/magma/configs/  &&
            mkdir -p /var/opt/magma/certs &&  cp -f /certs/rootCA.pem /var/opt/magma/certs/ &&
            /usr/local/bin/generate_nghttpx_config.py
          image: "{{ .Values.image.repository }}/agw_gateway_python{{ .Values.image.arch}}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: agwc-config
          resources: {}
          volumeMounts:
            - mountPath: /etc/magma
              name: magma-config
            - mountPath: /var/opt/magma
              name: agwc-claim
            - mountPath: /certs
              name: agwc-secret
            - mountPath: /configs
              name: controlproxy-config
      volumes:
        - name: magma-config
          hostPath:
            path: /etc/magma
            type: DirectoryOrCreate
        - name: agwc-claim
          persistentVolumeClaim:
            claimName: agwc-claim
        - name: agwc-secret
          secret:
            secretName: {{ .Values.secret.certs }}
        - name: controlproxy-config
          configMap:
            name: controlproxy-config
