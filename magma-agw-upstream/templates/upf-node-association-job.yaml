{{- if .Values.upfNodeAssociation.enabled }}
{{ include "magma-agw-upstream.assertNoLatest" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-upf-node-association-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: upf-node-association
{{ include "default-labels" . | indent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: upf-node-association
{{ include "default-selector-labels" . | indent 8 }}
    spec:
      restartPolicy: OnFailure
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: associate
          image: "{{ .Values.image.repository }}/agw_gateway_python{{ .Values.image.arch}}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
            - |
              python3 - <<'PY'
              import os
              import subprocess
              import time

              import grpc
              from google.protobuf.timestamp_pb2 import Timestamp
              from lte.protos.session_manager_pb2 import (
                  UPFAssociationState,
                  UPFFeatureSet,
                  UPFNodeState,
                  UserPlaneIPResourceSchema,
              )
              from lte.protos.session_manager_pb2_grpc import SetInterfaceForUserPlaneStub

              def detect_interface_ip(iface):
                  output = subprocess.check_output(
                      ["ip", "-4", "addr", "show", "dev", iface],
                      text=True,
                  )
                  for line in output.splitlines():
                      line = line.strip()
                      if line.startswith("inet "):
                          return line.split()[1].split("/")[0]
                  raise RuntimeError("no IPv4 address found on {}".format(iface))

              n3_address = os.environ.get("UPF_N3_ADDRESS") or detect_interface_ip(
                  os.environ["UPF_N3_INTERFACE"]
              )
              upf_id = os.environ.get("UPF_ID") or n3_address
              target = "{}:{}".format(
                  os.environ.get("SESSIOND_HOST", "127.0.0.1"),
                  os.environ.get("SESSIOND_PORT", "50065"),
              )
              retries = int(os.environ.get("RETRIES", "60"))
              delay = float(os.environ.get("RETRY_INTERVAL_SECONDS", "2"))
              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      channel = grpc.insecure_channel(target)
                      stub = SetInterfaceForUserPlaneStub(channel)
                      timestamp = Timestamp()
                      timestamp.GetCurrentTime()
                      state = UPFNodeState(upf_id=upf_id)
                      state.associaton_state.CopyFrom(
                          UPFAssociationState(
                              state_version=int(time.time()),
                              assoc_state=UPFAssociationState.ESTABLISHED,
                              feature_set=UPFFeatureSet(f_teid=True),
                              recovery_time_stamp=timestamp,
                              ip_resource_schema=[
                                  UserPlaneIPResourceSchema(
                                      ipv4_address=n3_address,
                                      teid_range_indication=0,
                                      teid_range=0,
                                  )
                              ],
                          )
                      )
                      stub.SetUPFNodeState(state, timeout=5)
                      print(
                          "associated UPF node id={} n3={} target={}".format(
                              upf_id,
                              n3_address,
                              target,
                          ),
                          flush=True,
                      )
                      break
                  except Exception as exc:
                      last_error = exc
                      print(
                          "waiting for sessiond UPF API attempt {}/{}: {}".format(
                              attempt,
                              retries,
                              exc,
                          ),
                          flush=True,
                      )
                      time.sleep(delay)
              else:
                  raise SystemExit("failed to associate UPF node: {}".format(last_error))
              PY
          env:
            - name: SESSIOND_HOST
              value: {{ default "127.0.0.1" .Values.upfNodeAssociation.sessiondHost | quote }}
            - name: SESSIOND_PORT
              value: {{ default 50065 .Values.upfNodeAssociation.sessiondPort | quote }}
            - name: UPF_N3_INTERFACE
              value: {{ default "magma-n3" .Values.upfNodeAssociation.n3Interface | quote }}
            - name: UPF_N3_ADDRESS
              value: {{ .Values.upfNodeAssociation.n3Address | quote }}
            - name: UPF_ID
              value: {{ .Values.upfNodeAssociation.upfId | quote }}
            - name: RETRIES
              value: {{ default 60 .Values.upfNodeAssociation.retries | quote }}
            - name: RETRY_INTERVAL_SECONDS
              value: {{ default 2 .Values.upfNodeAssociation.retryIntervalSeconds | quote }}
{{- end }}
