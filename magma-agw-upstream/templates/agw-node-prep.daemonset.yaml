{{- if .Values.nodePrep.enabled }}
{{ include "magma-agw-upstream.assertNoLatest" . }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agw-node-prep
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: agw-node-prep
{{ include "default-labels" . | indent 4 }}
{{ include "image-version-label" . | indent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agw-node-prep
{{ include "default-selector-labels" . | indent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agw-node-prep
{{ include "default-selector-labels" . | indent 8 }}
    spec:
      hostNetwork: true
      hostPID: true
      restartPolicy: Always
      {{- with (default .Values.nodeSelector .Values.nodePrep.nodeSelector) }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: agw-node-prep
          image: {{ .Values.nodePrep.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/bash
            - -ceu
            - |
              log() { printf '[agw-node-prep] %s\n' "$*"; }
              host() { nsenter -t 1 -m -u -i -n -p -- "$@"; }
              host_sh() { nsenter -t 1 -m -u -i -n -p -- /bin/bash -ceu "$1"; }

              ensure_host_cmd() {
                local cmd="$1"
                if host_sh "command -v ${cmd} >/dev/null 2>&1"; then
                  log "${cmd} already present on host"
                  return
                fi
                {{- if .Values.nodePrep.installOpenvSwitch }}
                log "${cmd} missing; installing AGW host prerequisites"
                host_sh 'if ! command -v apt-get >/dev/null 2>&1; then echo "apt-get not found on host" >&2; exit 1; fi'
                host_sh 'export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y openvswitch-switch iproute2 iptables kmod'
                {{- else }}
                log "${cmd} missing and nodePrep.installOpenvSwitch=false"
                return 1
                {{- end }}
              }

              ensure_module() {
                local module="$1"
                if host_sh "lsmod | awk '{print \$1}' | grep -qx ${module}"; then
                  log "kernel module ${module} already loaded"
                else
                  log "loading kernel module ${module} if available"
                  host modprobe "${module}" || true
                fi
              }

              ensure_sysctl() {
                local key="$1"
                local value="$2"
                local current
                current="$(host sysctl -n "${key}" 2>/dev/null || true)"
                if [ "${current}" = "${value}" ]; then
                  log "sysctl ${key}=${value} already set"
                else
                  log "setting sysctl ${key}=${value}"
                  host sysctl -w "${key}=${value}"
                fi
              }

              ensure_ovs_started() {
                if host_sh 'ovs-vsctl show >/dev/null 2>&1'; then
                  log "Open vSwitch database already reachable"
                  return
                fi
                log "starting Open vSwitch"
                host_sh 'systemctl enable --now openvswitch-switch >/dev/null 2>&1 || service openvswitch-switch start >/dev/null 2>&1 || /usr/share/openvswitch/scripts/ovs-ctl start'
                host_sh 'ovs-vsctl show >/dev/null'
              }

              ensure_magma_ovs_kmod() {
                local script="$1"
                local run_upgrade="$2"
                local required="$3"
                if [ "${run_upgrade}" != "true" ]; then
                  log "Magma OVS kmod upgrade disabled"
                  return
                fi
                if host test -x "${script}"; then
                  log "running Magma OVS kmod upgrade script ${script}"
                  host "${script}"
                  return
                fi
                if [ "${required}" = "true" ]; then
                  log "required Magma OVS kmod upgrade script ${script} is missing"
                  return 1
                fi
                log "Magma OVS kmod upgrade script ${script} not present; continuing"
              }

              ensure_bridge() {
                local bridge="$1"
                if host ovs-vsctl br-exists "${bridge}"; then
                  log "OVS bridge ${bridge} already exists"
                else
                  log "creating OVS bridge ${bridge}"
                  host ovs-vsctl add-br "${bridge}"
                fi
                host ip link set "${bridge}" up
                host ovs-vsctl set bridge "${bridge}" protocols={{ .Values.nodePrep.bridge.protocols | quote }} other-config:disable-in-band=true
                {{- if .Values.nodePrep.bridge.datapathType }}
                host ovs-vsctl set bridge "${bridge}" datapath_type={{ .Values.nodePrep.bridge.datapathType | quote }}
                host ip link set "${bridge}" up || true
                {{- end }}
              }

              ensure_addr() {
                local iface="$1"
                local cidr="$2"
                local replace="${3:-false}"
                [ -n "${cidr}" ] || return 0
                if [ "${replace}" = "true" ]; then
                  while read -r existing; do
                    [ -n "${existing}" ] || continue
                    if [ "${existing}" != "${cidr}" ]; then
                      log "removing stale address ${existing} from ${iface}"
                      host ip addr del "${existing}" dev "${iface}" || true
                    fi
                  done < <(host_sh "ip -4 -o addr show dev ${iface}" | awk '{print $4}')
                fi
                if host ip addr show dev "${iface}" | grep -qw "${cidr}"; then
                  log "${iface} already has ${cidr}"
                else
                  log "adding ${cidr} to ${iface}"
                  host ip addr add "${cidr}" dev "${iface}" || true
                fi
              }

              ensure_dummy_iface() {
                local iface="$1"
                if host ip link show "${iface}" >/dev/null 2>&1; then
                  log "interface ${iface} already exists"
                else
                  {{- if .Values.nodePrep.interfaces.createMissing }}
                  log "creating dummy interface ${iface}"
                  host ip link add name "${iface}" type dummy
                  {{- else }}
                  log "interface ${iface} missing and nodePrep.interfaces.createMissing=false"
                  return 1
                  {{- end }}
                fi
                host ip link set "${iface}" up
              }

              ensure_macvlan_iface() {
                local iface="$1"
                local parent="$2"
                local mode="$3"
                if host ip link show "${iface}" >/dev/null 2>&1; then
                  log "interface ${iface} already exists"
                else
                  {{- if .Values.nodePrep.interfaces.createMissing }}
                  if ! host ip link show "${parent}" >/dev/null 2>&1; then
                    log "parent interface ${parent} missing for ${iface}"
                    return 1
                  fi
                  log "creating macvlan interface ${iface} on ${parent}"
                  host ip link add name "${iface}" link "${parent}" type macvlan mode "${mode}"
                  {{- else }}
                  log "interface ${iface} missing and nodePrep.interfaces.createMissing=false"
                  return 1
                  {{- end }}
                fi
                host ip link set "${iface}" up
              }

              ensure_data_iface() {
                local iface="$1"
                local type="$2"
                local parent="$3"
                local mode="$4"
                case "${type}" in
                  macvlan) ensure_macvlan_iface "${iface}" "${parent}" "${mode:-bridge}" ;;
                  physical|host-device)
                    if host ip link show "${iface}" >/dev/null 2>&1; then
                      log "using existing host interface ${iface}"
                      host ip link set "${iface}" up
                    else
                      log "host interface ${iface} missing"
                      return 1
                    fi
                    ;;
                  dummy|"") ensure_dummy_iface "${iface}" ;;
                  *)
                    log "unsupported nodePrep interface type ${type} for ${iface}"
                    return 1
                    ;;
                esac
              }

              cleanup_legacy_iface() {
                local iface="$1"
                if ! host ip link show "${iface}" >/dev/null 2>&1; then
                  log "legacy interface ${iface} is already absent"
                  return
                fi
                log "removing legacy interface ${iface}"
                host ip link del "${iface}" || true
              }

              ensure_ovs_internal_port() {
                local bridge="$1"
                local iface="$2"
                local ofport="${3:-}"
                if host ovs-vsctl --data=bare --no-heading --columns=name find Interface name="${iface}" | grep -qx "${iface}"; then
                  log "OVS internal port ${iface} already exists on ${bridge}"
                else
                  if host ip link show "${iface}" >/dev/null 2>&1; then
                    log "removing non-OVS interface ${iface} before creating internal port"
                    host ip link del "${iface}" || true
                  fi
                  log "creating OVS internal port ${iface} on ${bridge}"
                  host ovs-vsctl --may-exist add-port "${bridge}" "${iface}" -- set Interface "${iface}" type=internal
                fi
                if [ -n "${ofport}" ]; then
                  local current_ofport
                  current_ofport="$(host ovs-vsctl --if-exists get Interface "${iface}" ofport 2>/dev/null || true)"
                  if [ "${current_ofport}" != "${ofport}" ]; then
                    log "setting requested ofport ${ofport} for ${iface}"
                    host ovs-vsctl set Interface "${iface}" ofport_request="${ofport}"
                  fi
                fi
                if host ip link show "${iface}" >/dev/null 2>&1; then
                  host ip link set "${iface}" up || log "could not set OVS internal port ${iface} up; continuing"
                else
                  log "OVS internal port ${iface} has no host netdev yet; continuing"
                fi
              }

              ensure_ovs_gtpu_port() {
                local bridge="$1"
                local iface="$2"
                local ofport="$3"
                local type="$4"
                if host ovs-vsctl --data=bare --no-heading --columns=name find Interface name="${iface}" | grep -qx "${iface}"; then
                  local current_ofport
                  current_ofport="$(host ovs-vsctl --if-exists get Interface "${iface}" ofport 2>/dev/null || true)"
                  if [ "${current_ofport}" = "${ofport}" ]; then
                    log "OVS GTP-U port ${iface} already present on ${bridge} with ofport ${ofport}"
                    return
                  fi
                  log "recreating OVS GTP-U port ${iface}; current ofport is ${current_ofport:-unset}, expected ${ofport}"
                  host ovs-vsctl --if-exists del-port "${bridge}" "${iface}"
                else
                  log "creating OVS GTP-U port ${iface} on ${bridge}"
                fi
                host ovs-vsctl --may-exist add-port "${bridge}" "${iface}" -- \
                  set Interface "${iface}" type="${type}" options:remote_ip=flow options:key=flow ofport_request="${ofport}"
                local created_ofport
                created_ofport="$(host ovs-vsctl --if-exists get Interface "${iface}" ofport 2>/dev/null || true)"
                if [ "${created_ofport}" != "${ofport}" ]; then
                  log "OVS GTP-U port ${iface} is not ready; ofport=${created_ofport:-unset}, expected ${ofport}"
                  host ovs-vsctl --if-exists list Interface "${iface}" || true
                  return 1
                fi
              }

              cleanup_ovs_port() {
                local bridge="$1"
                local iface="$2"
                if host ovs-vsctl --if-exists get Interface "${iface}" name >/dev/null 2>&1; then
                  log "removing stale OVS port ${iface} from ${bridge}"
                  host ovs-vsctl --if-exists del-port "${bridge}" "${iface}"
                else
                  log "stale OVS port ${iface} is already absent"
                fi
              }

              ensure_host_cmd ovs-vsctl
              ensure_module openvswitch
              ensure_module nf_conntrack
              ensure_module gtp
              {{- range $key, $value := .Values.nodePrep.sysctl }}
              ensure_sysctl {{ $key | quote }} {{ $value | quote }}
              {{- end }}
              ensure_ovs_started
              ensure_magma_ovs_kmod {{ .Values.nodePrep.magmaOvsKmodUpgradePath | quote }} {{ .Values.nodePrep.runMagmaOvsKmodUpgrade | quote }} {{ .Values.nodePrep.requireMagmaOvsKmod | quote }}
              ensure_ovs_started
              ensure_bridge {{ .Values.nodePrep.bridge.name | quote }}
              ensure_addr {{ .Values.nodePrep.bridge.name | quote }} {{ .Values.nodePrep.bridge.address | quote }} "false"
              {{- if .Values.nodePrep.gtpu.enabled }}
              ensure_ovs_gtpu_port {{ .Values.nodePrep.bridge.name | quote }} {{ .Values.nodePrep.gtpu.name | quote }} {{ .Values.nodePrep.gtpu.ofport | quote }} {{ default "gtpu" .Values.nodePrep.gtpu.type | quote }}
              {{- else }}
              {{- range .Values.nodePrep.gtpu.cleanupPorts }}
              cleanup_ovs_port {{ $.Values.nodePrep.bridge.name | quote }} {{ . | quote }}
              {{- end }}
              {{- end }}
              {{- range .Values.nodePrep.interfaces.cleanupLegacy }}
              cleanup_legacy_iface {{ . | quote }}
              {{- end }}

              ensure_data_iface {{ .Values.nodePrep.interfaces.s1.name | quote }} {{ default "dummy" .Values.nodePrep.interfaces.s1.type | quote }} {{ default "" .Values.nodePrep.interfaces.s1.parent | quote }} {{ default "bridge" .Values.nodePrep.interfaces.s1.mode | quote }}
              ensure_addr {{ .Values.nodePrep.interfaces.s1.name | quote }} {{ .Values.nodePrep.interfaces.s1.address | quote }} {{ default false .Values.nodePrep.interfaces.s1.replaceAddresses | quote }}
              ensure_data_iface {{ .Values.nodePrep.interfaces.nat.name | quote }} {{ default "dummy" .Values.nodePrep.interfaces.nat.type | quote }} {{ default "" .Values.nodePrep.interfaces.nat.parent | quote }} {{ default "bridge" .Values.nodePrep.interfaces.nat.mode | quote }}
              ensure_addr {{ .Values.nodePrep.interfaces.nat.name | quote }} {{ .Values.nodePrep.interfaces.nat.address | quote }} {{ default false .Values.nodePrep.interfaces.nat.replaceAddresses | quote }}
              {{- range .Values.nodePrep.interfaces.internal }}
              {{- if eq .type "internal" }}
              ensure_ovs_internal_port {{ .bridge | quote }} {{ .name | quote }} {{ default "" .ofport | quote }}
              ensure_addr {{ .name | quote }} {{ default "" .address | quote }} "false"
              {{- else }}
              ensure_dummy_iface {{ .name | quote }}
              ensure_addr {{ .name | quote }} {{ default "" .address | quote }} "false"
              {{- end }}
              {{- end }}

              log "node preparation complete"
              {{- if .Values.nodePrep.sleepAfterPrep }}
              sleep infinity
              {{- end }}
{{- end }}
