apiVersion: v1
kind: Namespace
metadata:
  name: redroid-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redroid-binder-modules
  namespace: redroid-system
  labels:
    app.kubernetes.io/name: redroid-binder-modules
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redroid-binder-modules
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redroid-binder-modules
    spec:
      nodeSelector:
        redroid.io/enabled: "true"
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-and-load-binder
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/bash
            - -euc
          args:
            - |
              kernel="$(uname -r)"
              if ! chroot /host modinfo binder_linux >/dev/null 2>&1; then
                chroot /host apt-get update
                chroot /host env DEBIAN_FRONTEND=noninteractive \
                  apt-get install --yes --no-install-recommends \
                  "linux-modules-extra-${kernel}"
              fi

              chroot /host depmod -a "${kernel}"
              install -d /host/etc/modules-load.d /host/etc/modprobe.d
              printf '%s\n' binder_linux > /host/etc/modules-load.d/redroid.conf
              printf '%s\n' \
                'options binder_linux devices=binder,hwbinder,vndbinder' \
                > /host/etc/modprobe.d/redroid-binder.conf

              chroot /host modprobe binder_linux \
                devices=binder,hwbinder,vndbinder

              grep -q binder /host/proc/filesystems
              test -d /host/sys/module/binder_linux
          volumeMounts:
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
      containers:
        - name: verifier
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -euc
          args:
            - |
              trap : TERM INT
              while sleep 3600; do :; done
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -euc
                - >-
                  grep -q binder /host/proc/filesystems &&
                  test -d /host/sys/module/binder_linux
            initialDelaySeconds: 2
            periodSeconds: 30
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
