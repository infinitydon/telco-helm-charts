{{- with .Values.ue }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ueransim.fullname" $ }}-{{ .name }}
  labels:
    {{- include "ueransim.labels" $ | nindent 4 }}
    app: {{ $.Values.projectName }}
    component: {{ .name }}
spec:
  selector:
    matchLabels:
      {{- include "ueransim.selectorLabels" $ | nindent 6 }}
      app: {{ $.Values.projectName }}
      component: {{ .name }}
  replicas: {{ .replicaCount }}
  template:
    metadata:
      annotations:
        {{- include "ueransim.ueAnnotations" $ | nindent 8 }}
      labels:
        {{- include "ueransim.selectorLabels" $ | nindent 8 }}
        app: {{ $.Values.projectName }}
        component: {{ .name }}
    spec:
      imagePullSecrets:
        {{- toYaml .imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      containers:
      - image: {{ .image.name }}:{{ .image.tag | default $.Chart.AppVersion }}
        name: {{ .name }}
        securityContext:
            {{- toYaml .securityContext | nindent 12 }}
        command: ["{{ .volume.mount }}/wrapper.sh"]
        volumeMounts:
        - mountPath: {{ .volume.mount }}
          name: {{ .volume.name }}
        resources:
            {{- toYaml .resources | nindent 12 }}
{{- if $.Values.ueBrowser.enabled }}
      - image: {{ $.Values.ueBrowser.browser.image.repository }}:{{ $.Values.ueBrowser.browser.image.tag }}
        name: ue-browser
        imagePullPolicy: {{ $.Values.ueBrowser.browser.image.pullPolicy }}
        ports:
        - name: ue-browser
          containerPort: {{ $.Values.ueBrowser.browser.port }}
          protocol: TCP
        env:
        {{- range $name, $value := $.Values.ueBrowser.browser.env }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      - image: {{ $.Values.ueBrowser.proxy.image.repository }}:{{ $.Values.ueBrowser.proxy.image.tag }}
        name: ue-portal-proxy
        imagePullPolicy: {{ $.Values.ueBrowser.proxy.image.pullPolicy }}
        ports:
        - name: portal-proxy
          containerPort: {{ $.Values.ueBrowser.proxy.port }}
          protocol: TCP
        volumeMounts:
        - name: ue-browser-proxy
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
{{- if $.Values.ueBrowser.internetProxy.enabled }}
      - image: {{ $.Values.ueBrowser.internetProxy.image.repository }}:{{ $.Values.ueBrowser.internetProxy.image.tag }}
        name: ue-internet-proxy
        imagePullPolicy: {{ $.Values.ueBrowser.internetProxy.image.pullPolicy }}
        command:
        - sh
        - -ceu
        - |
          apk add --no-cache iproute2 tinyproxy
          while ! ip link show uesimtun0 >/dev/null 2>&1; do
            echo "waiting for uesimtun0"
            sleep 2
          done
          ue_ip="$(ip -4 -o addr show uesimtun0 | awk '{ split($4, a, "/"); print a[1]; exit }')"
          cp /etc/tinyproxy/tinyproxy.conf /tmp/tinyproxy.conf
          if [ -n "$ue_ip" ]; then
            printf '\nBind %s\n' "$ue_ip" >> /tmp/tinyproxy.conf
            echo "Tinyproxy outbound traffic is bound to $ue_ip"
          fi
          exec tinyproxy -d -c /tmp/tinyproxy.conf
        ports:
        - name: web-proxy
          containerPort: {{ $.Values.ueBrowser.internetProxy.port }}
          protocol: TCP
        volumeMounts:
        - name: ue-browser-proxy
          mountPath: /etc/tinyproxy/tinyproxy.conf
          subPath: tinyproxy.conf
      - image: {{ $.Values.ueBrowser.routeManager.image.repository }}:{{ $.Values.ueBrowser.routeManager.image.tag }}
        name: ue-5g-route-manager
        imagePullPolicy: {{ $.Values.ueBrowser.routeManager.image.pullPolicy }}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        command:
        - sh
        - -ceu
        - |
          apk add --no-cache iproute2 iptables
          while ! ip link show uesimtun0 >/dev/null 2>&1; do
            echo "waiting for uesimtun0"
            sleep 2
          done
          ip rule add fwmark {{ $.Values.ueBrowser.routeManager.mark }} table {{ $.Values.ueBrowser.routeManager.table }} 2>/dev/null || true
          ip route replace default dev uesimtun0 table {{ $.Values.ueBrowser.routeManager.table }}
          iptables -t mangle -C OUTPUT -p tcp -m owner --uid-owner {{ $.Values.ueBrowser.internetProxy.uid }} -j MARK --set-mark {{ $.Values.ueBrowser.routeManager.mark }} 2>/dev/null || \
            iptables -t mangle -A OUTPUT -p tcp -m owner --uid-owner {{ $.Values.ueBrowser.internetProxy.uid }} -j MARK --set-mark {{ $.Values.ueBrowser.routeManager.mark }}
          iptables -t nat -C POSTROUTING -o uesimtun0 -j MASQUERADE 2>/dev/null || \
            iptables -t nat -A POSTROUTING -o uesimtun0 -j MASQUERADE
          iptables -t mangle -C POSTROUTING -o uesimtun0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || \
            iptables -t mangle -A POSTROUTING -o uesimtun0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
          echo "Chromium proxy traffic is routed through uesimtun0"
          tail -f /dev/null
{{- end }}
{{- if $.Values.ueBrowser.usageReporter.enabled }}
      - image: {{ $.Values.ueBrowser.usageReporter.image.repository }}:{{ $.Values.ueBrowser.usageReporter.image.tag }}
        name: ue-usage-reporter
        imagePullPolicy: {{ $.Values.ueBrowser.usageReporter.image.pullPolicy }}
        command:
        - sh
        - -ceu
        - |
          apk add --no-cache curl
          iface="{{ $.Values.ueBrowser.usageReporter.interface }}"
          while ! ip link show "$iface" >/dev/null 2>&1; do
            echo "waiting for $iface"
            sleep 2
          done
          while true; do
            rx="$(cat /sys/class/net/$iface/statistics/rx_bytes 2>/dev/null || echo 0)"
            tx="$(cat /sys/class/net/$iface/statistics/tx_bytes 2>/dev/null || echo 0)"
            payload="$(printf '{"ueId":"%s","rxBytes":%s,"txBytes":%s,"source":"%s"}' "{{ $.Values.ueBrowser.subscriberSupi }}" "$rx" "$tx" "$iface")"
            curl -fsS -H 'Content-Type: application/json' -d "$payload" "{{ $.Values.ueBrowser.usageReporter.portalUrl }}/api/usage" || true
            sleep {{ $.Values.ueBrowser.usageReporter.intervalSeconds }}
          done
{{- end }}
{{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .affinity | nindent 8 }}
      tolerations:
        {{- toYaml .tolerations | nindent 8 }}

      volumes:
      - name: {{ .volume.name }}
        configMap:
          name: {{ .configmap.name }}
          items:
          - key: ue-config.yaml
            path: ue-config.yaml
          - key: wrapper.sh
            path: wrapper.sh
            mode: 0755
{{- if $.Values.ueBrowser.enabled }}
      - name: ue-browser-proxy
        configMap:
          name: {{ include "ueransim.fullname" $ }}-ue-browser-proxy
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ $.Values.ueBrowser.browser.shmSize }}
{{- end }}
{{- end }}
{{- end }}
