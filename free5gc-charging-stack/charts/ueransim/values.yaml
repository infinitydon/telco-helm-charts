#
# Default values for ueransim-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  free5gcReleaseName: free5gc-helm  # Name of the free5gc helm release
  gnb:
    multus:
      enabled: false
      n2network:
        enabled: true
        name: n2network
        type: ipvlan
        masterIf: eth0
        subnetIP: 10.100.50.248
        cidr: 29
        gatewayIP: 10.100.50.254
        excludeIP: 10.100.50.254
      n3network:
        enabled: true
        name: n3network
        type: ipvlan
        masterIf: eth0
        subnetIP: 10.100.50.232
        cidr: 29
        gatewayIP: 10.100.50.238
        excludeIP: 10.100.50.238


projectName: ueransim

ueBrowser:
  enabled: false
  subscriberSupi: imsi-208930000000001
  portalServiceUrl: http://free5gc-charging-stack-user-charging-portal:8080
  trustedSubscriberHeader: x-subscriber-supi
  browser:
    image:
      repository: kasmweb/chromium
      tag: 1.17.0
      pullPolicy: IfNotPresent
    port: 6901
    shmSize: 1Gi
    env:
      VNC_PW: free5gc
      LAUNCH_URL: http://127.0.0.1:18080/
      APP_ARGS: "--start-maximized --proxy-server=http://127.0.0.1:18888 --proxy-bypass-list=127.0.0.1;localhost;*.svc;*.svc.cluster.local;10.0.0.0/8;192.168.0.0/16"
  proxy:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: 1.29.3-alpine
    pullPolicy: IfNotPresent
    port: 18080
  internetProxy:
    enabled: true
    image:
      repository: alpine
      tag: 3.22.1
      pullPolicy: IfNotPresent
    port: 18888
    user: nobody
    group: nobody
    uid: 65534
  routeManager:
    image:
      repository: alpine
      tag: 3.22.1
      pullPolicy: IfNotPresent
    mark: "0x5"
    table: "105"
  quotaGuard:
    intervalSeconds: 5
  usageReporter:
    enabled: false
    image:
      repository: alpine
      tag: 3.22.1
      pullPolicy: IfNotPresent
    portalUrl: http://free5gc-charging-stack-free5gc-charging-portal:8080
    intervalSeconds: 5
    interface: uesimtun0
  service:
    type: NodePort
    port: 6901
    nodePort: 31382

initcontainers:
  sctp_test:
    enabled: false
    image: free5gc/ueransim
    tag: v4.2.2

gnb:
  enabled: true
  name: gnb
  replicaCount: 1
  image:
    name: free5gc/ueransim
    tag: v4.2.2
    pullPolicy: IfNotPresent
  configmap:
    name: gnb-configmap
  volume:
    name: gnb-volume
    mount: /ueransim/config
  service:
    name: gnb-service
    type: ClusterIP
    port: 4997
    protocol: UDP

  n2if:  # NGAP
    ipAddress: 10.100.50.250
  n3if:  # GTP-U
    ipAddress: 10.100.50.236

  amf:
    n2if:  # NGAP
      ipAddress: 10.100.50.249
      serviceName: free5gc-amf-amf-n2
      port: 38412
    service:
      ngap:
        enabled: false

  podAnnotations: {}
    # additional annotations
  imagePullSecrets: []
  podSecurityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

  configuration: |-
    mcc: '208' # Mobile Country Code value
    mnc: '93'  # Mobile Network Code value (2 or 3 digits)
    nci: '0x000000010'  # NR Cell Identity (36-bit)
    idLength: 32        # NR gNB ID length in bits [22...32]
    tac: 1     # Tracking Area Code
    # List of supported S-NSSAIs by this gNB
    slices:
      - sst: 0x1
        sd: 0x010203
    # Indicates whether or not SCTP stream number errors should be ignored.
    ignoreStreamIds: true
ue:
  enabled: true
  name: ue
  replicaCount: 1
  image:
    name: free5gc/ueransim
    tag: v4.2.2
    pullPolicy: IfNotPresent
  configmap:
    name: ue-configmap
  volume:
    name: ue-volume
    mount: /ueransim/config
  command: "./nr-ue -c ./config/ue-config.yaml"  # This is the command that will be launched in the UE container
  # A script that will be run after the UE creation. It may be used to periodically generate traffic
  script: ""
  # script: |-
  #   ping .....

  podAnnotations: {}
    # additional annotations
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext:
    capabilities:
            add: ["NET_ADMIN"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

  configuration: |-
    supi: "imsi-208930000000001"  # IMSI number
    mcc: "208" # Mobile Country Code value
    mnc: "93" # Mobile Network Code value (2 or 3 digits)
    key: "8baf473f2f8fd09487cccbd7097c6862" # Operator code (OP or OPC) of the UE
    op: "8e27b6af0e692e750f32667a3b14605d" # This value specifies the OP type and it can be either 'OP' or 'OPC'
    opType: "OPC" # This value specifies the OP type and it can be either 'OP' or 'OPC'
    amf: "8000" # Authentication Management Field (AMF) value
    imei: "356938035643803" # IMEI number of the device
    imeiSv: "4370816125816151"
    # UAC Access Identities Configuration
    uacAic:
      mps: false
      mcs: false
    # UAC Access Control Class
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false
    sessions:
      - type: "IPv4"
        apn: "internet"
        slice:
          sst: 0x01
          sd: 0x010203
    # Configured NSSAI for this UE by HPLMN
    configured-nssai:
      - sst: 0x01
        sd: 0x010203
    # Default Configured NSSAI for this UE
    default-nssai:
      - sst: 1
        sd: 1
    # Supported encryption and integrity algorithms by this UE
    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    # Integrity protection maximum data rate for user plane
    integrityMaxRate:
      uplink: "full"
      downlink: "full"

  test:
    connectivity:
      name: ue-connectivity-test
      image: dtzar/helm-kubectl:3.19.0
      configmap:
        name: connectivity-test-configmap
      volume:
        name: connectivity-test-volume
        mount: /scripts
      ttlseconds: 50
