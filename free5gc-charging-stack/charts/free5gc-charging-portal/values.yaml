replicaCount: 1

image:
  repository: ghcr.io/infinitydon/free5gc-charging-portal
  tag: "v0.1.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: NodePort
  port: 8080
  nodePort: 31380

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: free5gc-charging.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

config:
  portalTitle: free5GC Charging Portal
  mongoUri: mongodb://mongodb:27017
  mongoDb: free5gc
  chfBaseUrl: http://chf:8000
  chfNotifyEnabled: true
  endUserSelfTopup: true

auth:
  operatorPin: admin123
  chfBearerToken: ""
  existingSecret: ""
  operatorPinKey: operator-pin
  chfBearerTokenKey: chf-bearer-token

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http
