{{- if .Values.n6Gateway.enabled }}
{{- if or (eq .Values.n6Gateway.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.n6Gateway.image.tag) -}}
{{- fail "n6Gateway.image.tag must not use latest" -}}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-n6-gateway
  labels:
    app.kubernetes.io/name: n6-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: n6-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n6-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        {{- toYaml .Values.n6Gateway.nodeSelector | nindent 8 }}
      tolerations:
        - operator: Exists
      containers:
        - name: n6-gateway
          image: "{{ .Values.n6Gateway.image.repository }}:{{ .Values.n6Gateway.image.tag }}"
          imagePullPolicy: {{ .Values.n6Gateway.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: MASTER_IF
              value: {{ .Values.n6Gateway.masterIf | quote }}
            - name: GATEWAY_IF
              value: {{ .Values.n6Gateway.gatewayIf | quote }}
            - name: GATEWAY_CIDR
              value: "{{ .Values.n6Gateway.gatewayIp }}/{{ .Values.n6Gateway.cidr }}"
            - name: N6_SUBNET
              value: {{ .Values.n6Gateway.subnet | quote }}
            - name: UPLINK_IF
              value: {{ .Values.n6Gateway.uplinkIf | quote }}
          command:
            - sh
            - -ceu
            - |
              apk add --no-cache iproute2 iptables

              cleanup() {
                iptables -t nat -D POSTROUTING -s "${N6_SUBNET}" -o "${UPLINK_IF}" -j MASQUERADE 2>/dev/null || true
                iptables -D FORWARD -i "${GATEWAY_IF}" -o "${UPLINK_IF}" -j ACCEPT 2>/dev/null || true
                iptables -D FORWARD -i "${UPLINK_IF}" -o "${GATEWAY_IF}" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
                ip link delete "${GATEWAY_IF}" 2>/dev/null || true
              }
              trap cleanup EXIT INT TERM

              if ! ip link show "${GATEWAY_IF}" >/dev/null 2>&1; then
                ip link add "${GATEWAY_IF}" link "${MASTER_IF}" type macvlan mode bridge
              fi
              ip addr replace "${GATEWAY_CIDR}" dev "${GATEWAY_IF}"
              ip link set "${GATEWAY_IF}" up

              sysctl -w net.ipv4.ip_forward=1
              iptables -C FORWARD -i "${GATEWAY_IF}" -o "${UPLINK_IF}" -j ACCEPT 2>/dev/null || \
                iptables -A FORWARD -i "${GATEWAY_IF}" -o "${UPLINK_IF}" -j ACCEPT
              iptables -C FORWARD -i "${UPLINK_IF}" -o "${GATEWAY_IF}" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \
                iptables -A FORWARD -i "${UPLINK_IF}" -o "${GATEWAY_IF}" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
              iptables -t nat -C POSTROUTING -s "${N6_SUBNET}" -o "${UPLINK_IF}" -j MASQUERADE 2>/dev/null || \
                iptables -t nat -A POSTROUTING -s "${N6_SUBNET}" -o "${UPLINK_IF}" -j MASQUERADE

              echo "N6 gateway ${GATEWAY_CIDR} is forwarding ${N6_SUBNET} through ${UPLINK_IF}"
              while true; do sleep 3600; done
{{- end }}
