{{- if .Values.userPortal.enabled -}}
{{- if or (eq .Values.userPortal.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.userPortal.image.tag) -}}
{{- fail "userPortal.image.tag must not use latest" -}}
{{- end -}}
{{- $operatorPortal := index .Values "free5gc-charging-portal" -}}
{{- $pullSecrets := default $operatorPortal.imagePullSecrets .Values.userPortal.imagePullSecrets -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-user-charging-portal
  labels:
    app.kubernetes.io/name: user-charging-portal
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.userPortal.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: user-charging-portal
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-charging-portal
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.userPortal.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          securityContext:
            {{- toYaml .Values.userPortal.securityContext | nindent 12 }}
          image: "{{ .Values.userPortal.image.repository }}:{{ .Values.userPortal.image.tag }}"
          imagePullPolicy: {{ .Values.userPortal.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORTAL_TITLE
              value: {{ .Values.userPortal.config.portalTitle | quote }}
            - name: PORTAL_MODE
              value: "user"
            - name: MONGO_URI
              value: {{ .Values.userPortal.config.mongoUri | quote }}
            - name: MONGO_DB
              value: {{ .Values.userPortal.config.mongoDb | quote }}
            - name: CHF_BASE_URL
              value: {{ .Values.userPortal.config.chfBaseUrl | quote }}
            - name: CHF_NOTIFY_ENABLED
              value: {{ .Values.userPortal.config.chfNotifyEnabled | quote }}
            - name: END_USER_SELF_TOPUP
              value: {{ .Values.userPortal.config.endUserSelfTopup | quote }}
            - name: TRUSTED_SUBSCRIBER_HEADER_ENABLED
              value: {{ .Values.userPortal.config.trustedSubscriberHeaderEnabled | quote }}
            - name: TRUSTED_SUBSCRIBER_HEADER
              value: {{ .Values.userPortal.config.trustedSubscriberHeader | quote }}
            - name: SUBSCRIBER_BINDINGS_JSON
              value: {{ .Values.userPortal.config.subscriberBindingsJson | quote }}
            - name: DEFAULT_SUBSCRIBER_SUPI
              value: {{ .Values.userPortal.config.defaultSubscriberSupi | quote }}
          livenessProbe:
            {{- toYaml .Values.userPortal.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.userPortal.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.userPortal.resources | nindent 12 }}
      {{- with .Values.userPortal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-user-charging-portal
  labels:
    app.kubernetes.io/name: user-charging-portal
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.userPortal.service.type }}
  ports:
    - name: http
      port: {{ .Values.userPortal.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.userPortal.service.type "NodePort") .Values.userPortal.service.nodePort }}
      nodePort: {{ .Values.userPortal.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: user-charging-portal
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
