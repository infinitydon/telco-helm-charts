labNodeSelector:
  kubernetes.io/hostname: ebpf-bng-node-02

stackSmokeTest:
  enabled: false

n6Gateway:
  enabled: true
  image:
    repository: alpine
    tag: "3.22.1"
    pullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-02
  masterIf: enp8s22
  gatewayIf: free5gc-n6-gw
  gatewayIp: 10.201.60.1
  cidr: 24
  subnet: 10.201.60.0/24
  uplinkIf: eth0

free5gc:
  global:
    name: free5gc
    projectName: free5gc
    userPlaneArchitecture: single
    uesubnet: 10.60.0.0/16
    sbi:
      scheme: http
    amf:
      multus:
        enabled: true
        n2if:
          ipAddress: 10.201.10.10
        n2network:
          enabled: true
          name: n2network
          type: macvlan
          masterIf: enp8s19
          subnetIP: 10.201.10.0
          cidr: 24
          gatewayIP: 10.201.10.1
          excludeIP: 10.201.10.1
      service:
        ngap:
          enabled: false
    smf:
      multus:
        enabled: true
        n4if:
          ipAddress: 10.201.40.10
        n4network:
          enabled: true
          name: n4network
          type: macvlan
          masterIf: enp8s21
          subnetIP: 10.201.40.0
          cidr: 24
          gatewayIP: 10.201.40.1
          excludeIP: 10.201.40.1
    upf:
      multus:
        enabled: true
        upf:
          n3if:
            ipAddress: 10.201.30.10
          n4if:
            ipAddress: 10.201.40.20
          n6if:
            ipAddress: 10.201.60.10
        n3network:
          enabled: true
          name: n3network
          type: macvlan
          masterIf: enp8s20
          subnetIP: 10.201.30.0
          cidr: 24
          gatewayIP: 10.201.30.1
          excludeIP: 10.201.30.1
        n4network:
          enabled: true
          name: n4network
          type: macvlan
          masterIf: enp8s21
          subnetIP: 10.201.40.0
          cidr: 24
          gatewayIP: 10.201.40.1
          excludeIP: 10.201.40.1
        n6network:
          enabled: true
          name: n6network
          type: macvlan
          masterIf: enp8s22
          subnetIP: 10.201.60.0
          cidr: 24
          gatewayIP: 10.201.60.1
          excludeIP: 10.201.60.1

  deployMongoDb: true
  deployAmf: true
  deployAusf: true
  deployChf: true
  deployN3iwf: false
  deployNef: false
  deployNrf: true
  deployNssf: true
  deployPcf: true
  deploySmf: true
  deployUdm: true
  deployUdr: true
  deployUpf: true
  deployWebui: true
  deployDbPython: false

  mongodb:
    fullnameOverride: mongodb
    auth:
      enabled: false
    persistence:
      enabled: false
    nodeSelector:
      kubernetes.io/hostname: ebpf-bng-node-02

  free5gc-amf:
    amf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-ausf:
    ausf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-chf:
    chf:
      image:
        name: ghcr.io/infinitydon/free5gc-chf-prepaid
        tag: "v1.2.5-prepaid.3"
        pullPolicy: IfNotPresent
      imagePullSecrets:
        - name: ghcr-kaniko
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-nrf:
    nrf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-nssf:
    nssf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-pcf:
    pcf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-smf:
    smf:
      image:
        name: ghcr.io/infinitydon/free5gc-smf-prepaid
        tag: "v1.4.5-prepaid.2"
        pullPolicy: IfNotPresent
      imagePullSecrets:
        - name: ghcr-kaniko
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
      configuration:
        logger:
          reportCaller: true
        urrConfiguration: |-
          urrPeriod: 10
          urrThreshold: 1000
          requestedUnit: 1048576
        ueRoutingInfo: |-
          UE1:
            members:
            - imsi-208930000000001
            topology:
              - A: gNB1
                B: UPF
  free5gc-udm:
    udm:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-udr:
    udr:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-upf:
    upf:
      configmap:
        wrapperAdditionalCommands: |
          echo 1 > /proc/sys/net/ipv4/ip_forward
          echo "[wrapper] IPv4 forwarding: $(cat /proc/sys/net/ipv4/ip_forward)"
      podSecurityContext:
        sysctls: []
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        capabilities:
          add: ["NET_ADMIN"]
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 2Gi
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-webui:
    webui:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02

free5gc-charging-portal:
  image:
    repository: ghcr.io/infinitydon/free5gc-charging-portal
    tag: "v0.3.15"
  imagePullSecrets:
    - name: ghcr-kaniko
  service:
    type: NodePort
    nodePort: 31380
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-02
  config:
    portalTitle: free5GC Operator Charging Portal
    portalMode: operator
    mongoUri: mongodb://mongodb:27017
    mongoDb: free5gc
    chfBaseUrl: http://free5gc-charging-stack-free5gc-chf-service:8080
    chfNotifyEnabled: true
    endUserSelfTopup: false
  auth:
    operatorPin: admin123

userPortal:
  enabled: true
  image:
    repository: ghcr.io/infinitydon/free5gc-charging-portal
    tag: "v0.3.15"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-kaniko
  replicaCount: 1
  service:
    type: NodePort
    port: 8080
    nodePort: 31381
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-02
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  config:
    portalTitle: free5GC Data Top-Up
    mongoUri: mongodb://mongodb:27017
    mongoDb: free5gc
    chfBaseUrl: http://free5gc-charging-stack-free5gc-chf-service:8080
    chfNotifyEnabled: true
    endUserSelfTopup: true
    trustedSubscriberHeaderEnabled: true
    trustedSubscriberHeader: x-subscriber-supi
    subscriberBindingsJson: '{"10.60.0.0/16":"imsi-208930000000001"}'
    defaultSubscriberSupi: ""
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
  resources: {}

subscriberProvisioning:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.20.0"
    pullPolicy: IfNotPresent
  webuiBaseUrl: http://webui-service:5000
  username: admin
  password: free5gc
  subscriber:
    userNumber: 1
    ueId: imsi-208930000000001
    plmnID: "20893"
    AuthenticationSubscription:
      authenticationMethod: 5G_AKA
      permanentKey:
        permanentKeyValue: 8baf473f2f8fd09487cccbd7097c6862
        encryptionKey: 0
        encryptionAlgorithm: 0
      sequenceNumber: "000000000023"
      authenticationManagementField: "8000"
      milenage:
        op:
          opValue: ""
          encryptionKey: 0
          encryptionAlgorithm: 0
      opc:
        opcValue: 8e27b6af0e692e750f32667a3b14605d
        encryptionKey: 0
        encryptionAlgorithm: 0
    AccessAndMobilitySubscriptionData:
      gpsis:
        - msisdn-
      subscribedUeAmbr:
        uplink: 1 Gbps
        downlink: 2 Gbps
      nssai:
        defaultSingleNssais:
          - sst: 1
            sd: "010203"
        singleNssais:
          - sst: 1
            sd: "112233"
    SessionManagementSubscriptionData:
      - singleNssai:
          sst: 1
          sd: "010203"
        dnnConfigurations:
          internet:
            pduSessionTypes:
              defaultSessionType: IPV4
              allowedSessionTypes:
                - IPV4
            sscModes:
              defaultSscMode: SSC_MODE_1
              allowedSscModes:
                - SSC_MODE_2
                - SSC_MODE_3
            5gQosProfile:
              5qi: 9
              arp:
                priorityLevel: 8
                preemptCap: ""
                preemptVuln: ""
              priorityLevel: 8
            sessionAmbr:
              uplink: 1000 Mbps
              downlink: 1000 Mbps
            staticIpAddress: []
      - singleNssai:
          sst: 1
          sd: "112233"
        dnnConfigurations:
          internet:
            pduSessionTypes:
              defaultSessionType: IPV4
              allowedSessionTypes:
                - IPV4
            sscModes:
              defaultSscMode: SSC_MODE_1
              allowedSscModes:
                - SSC_MODE_2
                - SSC_MODE_3
            5gQosProfile:
              5qi: 9
              arp:
                priorityLevel: 8
                preemptCap: ""
                preemptVuln: ""
              priorityLevel: 8
            sessionAmbr:
              uplink: 1000 Mbps
              downlink: 1000 Mbps
            staticIpAddress: []
    SmfSelectionSubscriptionData:
      subscribedSnssaiInfos:
        "01010203":
          dnnInfos:
            - dnn: internet
        "01112233":
          dnnInfos:
            - dnn: internet
    AmPolicyData:
      subscCats:
        - free5gc
    SmPolicyData:
      smPolicySnssaiData:
        "01010203":
          snssai:
            sst: 1
            sd: "010203"
          smPolicyDnnData:
            internet:
              dnn: internet
        "01112233":
          snssai:
            sst: 1
            sd: "112233"
          smPolicyDnnData:
            internet:
              dnn: internet
    FlowRules:
      - filter: any
        precedence: 128
        snssai: "01010203"
        dnn: internet
        qosRef: 1
      - filter: any
        precedence: 128
        snssai: "01112233"
        dnn: internet
        qosRef: 1
    QosFlows:
      - snssai: "01010203"
        dnn: internet
        qosRef: 1
        5qi: 8
        mbrUL: 208 Mbps
        mbrDL: 208 Mbps
        gbrUL: 108 Mbps
        gbrDL: 108 Mbps
      - snssai: "01112233"
        dnn: internet
        qosRef: 1
        5qi: 8
        mbrUL: 208 Mbps
        mbrDL: 208 Mbps
        gbrUL: 108 Mbps
        gbrDL: 108 Mbps
    ChargingDatas:
      - chargingMethod: Online
        quota: "104857600"
        unitCost: "1"
        snssai: "01010203"
        dnn: ""
        filter: ""
        qosRef: 1
      - chargingMethod: Online
        quota: "104857600"
        unitCost: "1"
        snssai: "01010203"
        dnn: internet
        filter: any
        qosRef: 1
      - chargingMethod: Online
        quota: "104857600"
        unitCost: "1"
        snssai: "01112233"
        dnn: ""
        filter: ""
        qosRef: 1
      - chargingMethod: Online
        quota: "104857600"
        unitCost: "1"
        snssai: "01112233"
        dnn: internet
        filter: any
        qosRef: 1

ueransim:
  ueBrowser:
    enabled: true
    subscriberSupi: imsi-208930000000001
    portalServiceUrl: http://free5gc-charging-stack-user-charging-portal:8080
    trustedSubscriberHeader: x-subscriber-supi
    browser:
      image:
        repository: kasmweb/chromium
        tag: 1.17.0
        pullPolicy: IfNotPresent
      port: 6901
      shmSize: 1Gi
      env:
        VNC_PW: free5gc
        LAUNCH_URL: http://127.0.0.1:18080/
        APP_ARGS: "--start-maximized --no-first-run --no-default-browser-check --disable-background-networking --disable-sync --disable-component-update --disable-features=Translate,AutofillServerCommunication,OptimizationHints --proxy-server=http://127.0.0.1:18888 --proxy-bypass-list=127.0.0.1;localhost;*.svc;*.svc.cluster.local;10.0.0.0/8;192.168.0.0/16"
    proxy:
      image:
        repository: nginxinc/nginx-unprivileged
        tag: 1.29.3-alpine
      pullPolicy: IfNotPresent
      port: 18080
    internetProxy:
      enabled: true
      image:
        repository: alpine
        tag: 3.22.1
        pullPolicy: IfNotPresent
      port: 18888
      user: nobody
      group: nobody
      uid: 65534
      timeoutSeconds: 120
      maxClients: 500
    routeManager:
      image:
        repository: alpine
        tag: 3.22.1
        pullPolicy: IfNotPresent
      mark: "0x5"
      table: "105"
    quotaGuard:
      enabled: false
      intervalSeconds: 5
    usageReporter:
      enabled: false
      image:
        repository: alpine
        tag: 3.22.1
        pullPolicy: IfNotPresent
      portalUrl: http://free5gc-charging-stack-free5gc-charging-portal:8080
      intervalSeconds: 5
      interface: uesimtun0
    service:
      type: NodePort
      port: 6901
      nodePort: 31382
  global:
    free5gcReleaseName: free5gc-charging-stack
    gnb:
      multus:
        enabled: true
        n2network:
          enabled: true
          name: n2network
          type: macvlan
          masterIf: enp8s19
          subnetIP: 10.201.10.0
          cidr: 24
          gatewayIP: 10.201.10.1
          excludeIP: 10.201.10.1
        n3network:
          enabled: true
          name: n3network
          type: macvlan
          masterIf: enp8s20
          subnetIP: 10.201.30.0
          cidr: 24
          gatewayIP: 10.201.30.1
          excludeIP: 10.201.30.1
  initcontainers:
    sctp_test:
      enabled: false
      image: ghcr.io/infinitydon/ueransim
      tag: "v3.2.4-rls600s"
  gnb:
    enabled: true
    image:
      name: ghcr.io/infinitydon/ueransim
      tag: "v3.2.4-rls600s"
      pullPolicy: IfNotPresent
    n2if:
      ipAddress: 10.201.10.20
    n3if:
      ipAddress: 10.201.30.20
    amf:
      n2if:
        ipAddress: 10.201.10.10
        serviceName: free5gc-amf-amf-n2
        port: 38412
    configuration: |-
      mcc: '208'
      mnc: '93'
      nci: '0x000000010'
      idLength: 32
      tac: 1
      slices:
        - sst: 0x1
          sd: 0x010203
        - sst: 0x1
          sd: 0x112233
      ignoreStreamIds: true
    nodeSelector:
      kubernetes.io/hostname: ebpf-bng-node-02
  ue:
    enabled: true
    image:
      name: ghcr.io/infinitydon/ueransim
      tag: "v3.2.4-rls600s"
      pullPolicy: IfNotPresent
    configuration: |-
      supi: "imsi-208930000000001"
      mcc: "208"
      mnc: "93"
      key: "8baf473f2f8fd09487cccbd7097c6862"
      op: "8e27b6af0e692e750f32667a3b14605d"
      opType: "OPC"
      amf: "8000"
      imei: "356938035643803"
      imeiSv: "4370816125816151"
      uacAic:
        mps: false
        mcs: false
      uacAcc:
        normalClass: 0
        class11: false
        class12: false
        class13: false
        class14: false
        class15: false
      sessions:
        - type: "IPv4"
          apn: "internet"
          slice:
            sst: 0x01
            sd: 0x112233
      configured-nssai:
        - sst: 0x01
          sd: 0x112233
      default-nssai:
        - sst: 1
          sd: 0x112233
      integrity:
        IA1: true
        IA2: true
        IA3: true
      ciphering:
        EA1: true
        EA2: true
        EA3: true
      integrityMaxRate:
