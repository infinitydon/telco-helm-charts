labNodeSelector:
  kubernetes.io/hostname: ebpf-bng-node-02

stackSmokeTest:
  enabled: false

free5gc:
  global:
    name: free5gc
    projectName: free5gc
    userPlaneArchitecture: single
    uesubnet: 10.60.0.0/16
    sbi:
      scheme: http
    amf:
      multus:
        enabled: true
        n2if:
          ipAddress: 10.201.10.10
        n2network:
          enabled: true
          name: n2network
          type: macvlan
          masterIf: enp8s19
          subnetIP: 10.201.10.0
          cidr: 24
          gatewayIP: 10.201.10.1
          excludeIP: 10.201.10.1
      service:
        ngap:
          enabled: false
    smf:
      multus:
        enabled: true
        n4if:
          ipAddress: 10.201.40.10
        n4network:
          enabled: true
          name: n4network
          type: macvlan
          masterIf: enp8s21
          subnetIP: 10.201.40.0
          cidr: 24
          gatewayIP: 10.201.40.1
          excludeIP: 10.201.40.1
    upf:
      multus:
        enabled: true
        upf:
          n3if:
            ipAddress: 10.201.30.10
          n4if:
            ipAddress: 10.201.40.20
          n6if:
            ipAddress: 10.201.60.10
        n3network:
          enabled: true
          name: n3network
          type: macvlan
          masterIf: enp8s20
          subnetIP: 10.201.30.0
          cidr: 24
          gatewayIP: 10.201.30.1
          excludeIP: 10.201.30.1
        n4network:
          enabled: true
          name: n4network
          type: macvlan
          masterIf: enp8s21
          subnetIP: 10.201.40.0
          cidr: 24
          gatewayIP: 10.201.40.1
          excludeIP: 10.201.40.1
        n6network:
          enabled: true
          name: n6network
          type: macvlan
          masterIf: enp8s22
          subnetIP: 10.201.60.0
          cidr: 24
          gatewayIP: 10.201.60.1
          excludeIP: 10.201.60.1

  deployMongoDb: true
  deployAmf: true
  deployAusf: true
  deployChf: true
  deployN3iwf: false
  deployNef: false
  deployNrf: true
  deployNssf: true
  deployPcf: true
  deploySmf: true
  deployUdm: true
  deployUdr: true
  deployUpf: true
  deployWebui: true
  deployDbPython: false

  mongodb:
    fullnameOverride: mongodb
    auth:
      enabled: false
    persistence:
      enabled: false
    nodeSelector:
      kubernetes.io/hostname: ebpf-bng-node-02

  free5gc-amf:
    amf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-ausf:
    ausf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-chf:
    chf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-nrf:
    nrf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-nssf:
    nssf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-pcf:
    pcf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-smf:
    smf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
      configuration:
        ueRoutingInfo: |-
          UE1:
            members:
            - imsi-208930000000001
            topology:
              - A: gNB1
                B: UPF
  free5gc-udm:
    udm:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-udr:
    udr:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-upf:
    upf:
      podSecurityContext:
        sysctls: []
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-webui:
    webui:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02

free5gc-charging-portal:
  image:
    repository: ghcr.io/infinitydon/free5gc-charging-portal
    tag: "v0.3.2"
  service:
    type: NodePort
    nodePort: 31380
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-02
  config:
    portalTitle: free5GC Operator Charging Portal
    portalMode: operator
    mongoUri: mongodb://mongodb:27017
    mongoDb: free5gc
    chfBaseUrl: http://free5gc-charging-stack-free5gc-chf-service:8000
    chfNotifyEnabled: true
    endUserSelfTopup: false
  auth:
    operatorPin: admin123

userPortal:
  enabled: true
  image:
    repository: ghcr.io/infinitydon/free5gc-charging-portal
    tag: "v0.3.2"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicaCount: 1
  service:
    type: NodePort
    port: 8080
    nodePort: 31381
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-02
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  config:
    portalTitle: free5GC User Fictitious Top-Up
    mongoUri: mongodb://mongodb:27017
    mongoDb: free5gc
    chfBaseUrl: http://free5gc-charging-stack-free5gc-chf-service:8000
    chfNotifyEnabled: true
    endUserSelfTopup: true
    trustedSubscriberHeaderEnabled: true
    trustedSubscriberHeader: x-subscriber-supi
    subscriberBindingsJson: '{"10.60.0.0/16":"imsi-208930000000001"}'
    defaultSubscriberSupi: ""
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
  resources: {}

subscriberProvisioning:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.20.0"
    pullPolicy: IfNotPresent
  webuiBaseUrl: http://webui-service:5000
  username: admin
  password: free5gc
  subscriber:
    userNumber: 1
    ueId: imsi-208930000000001
    plmnID: "20893"
    AuthenticationSubscription:
      authenticationMethod: 5G_AKA
      permanentKey:
        permanentKeyValue: 8baf473f2f8fd09487cccbd7097c6862
        encryptionKey: 0
        encryptionAlgorithm: 0
      sequenceNumber: "000000000023"
      authenticationManagementField: "8000"
      milenage:
        op:
          opValue: ""
          encryptionKey: 0
          encryptionAlgorithm: 0
      opc:
        opcValue: 8e27b6af0e692e750f32667a3b14605d
        encryptionKey: 0
        encryptionAlgorithm: 0
    AccessAndMobilitySubscriptionData:
      gpsis:
        - msisdn-
      subscribedUeAmbr:
        uplink: 1 Gbps
        downlink: 2 Gbps
      nssai:
        defaultSingleNssais:
          - sst: 1
            sd: "010203"
        singleNssais: []
    SessionManagementSubscriptionData:
      - singleNssai:
          sst: 1
          sd: "010203"
        dnnConfigurations:
          internet:
            pduSessionTypes:
              defaultSessionType: IPV4
              allowedSessionTypes:
                - IPV4
            sscModes:
              defaultSscMode: SSC_MODE_1
              allowedSscModes:
                - SSC_MODE_2
                - SSC_MODE_3
            5gQosProfile:
              5qi: 9
              arp:
                priorityLevel: 8
                preemptCap: ""
                preemptVuln: ""
              priorityLevel: 8
            sessionAmbr:
              uplink: 1000 Mbps
              downlink: 1000 Mbps
            staticIpAddress: []
    SmfSelectionSubscriptionData:
      subscribedSnssaiInfos:
        "01010203":
          dnnInfos:
            - dnn: internet
    AmPolicyData:
      subscCats:
        - free5gc
    SmPolicyData:
      smPolicySnssaiData:
        "01010203":
          snssai:
            sst: 1
            sd: "010203"
          smPolicyDnnData:
            internet:
              dnn: internet
    FlowRules:
      - filter: 1.1.1.1/32
        precedence: 128
        snssai: "01010203"
        dnn: internet
        qosRef: 1
    QosFlows:
      - snssai: "01010203"
        dnn: internet
        qosRef: 1
        5qi: 8
        mbrUL: 208 Mbps
        mbrDL: 208 Mbps
        gbrUL: 108 Mbps
        gbrDL: 108 Mbps
    ChargingDatas:
      - chargingMethod: Offline
        quota: "100000"
        unitCost: "1"
        snssai: "01010203"
        dnn: ""
        filter: ""
      - chargingMethod: Online
        quota: "5000"
        unitCost: "1"
        snssai: "01010203"
        dnn: internet
        filter: 1.1.1.1/32
        qosRef: 1

ueransim:
  ueBrowser:
    enabled: true
    subscriberSupi: imsi-208930000000001
    portalServiceUrl: http://free5gc-charging-stack-user-charging-portal:8080
    trustedSubscriberHeader: x-subscriber-supi
    browser:
      image:
        repository: kasmweb/chromium
        tag: 1.17.0
        pullPolicy: IfNotPresent
      port: 6901
      shmSize: 1Gi
      env:
        VNC_PW: free5gc
    proxy:
      image:
        repository: nginxinc/nginx-unprivileged
        tag: 1.29.3-alpine
        pullPolicy: IfNotPresent
      port: 18080
    service:
      type: NodePort
      port: 6901
      nodePort: 31382
  global:
    free5gcReleaseName: free5gc-charging-stack
    gnb:
      multus:
        enabled: true
        n2network:
          enabled: true
          name: n2network
          type: macvlan
          masterIf: enp8s19
          subnetIP: 10.201.10.0
          cidr: 24
          gatewayIP: 10.201.10.1
          excludeIP: 10.201.10.1
        n3network:
          enabled: true
          name: n3network
          type: macvlan
          masterIf: enp8s20
          subnetIP: 10.201.30.0
          cidr: 24
          gatewayIP: 10.201.30.1
          excludeIP: 10.201.30.1
  initcontainers:
    sctp_test:
      enabled: false
      image: free5gc/ueransim
      tag: "v4.2.2"
  gnb:
    enabled: true
    image:
      name: free5gc/ueransim
      tag: "v4.2.2"
      pullPolicy: IfNotPresent
    n2if:
      ipAddress: 10.201.10.20
    n3if:
      ipAddress: 10.201.30.20
    amf:
      n2if:
        ipAddress: 10.201.10.10
        serviceName: free5gc-amf-amf-n2
        port: 38412
    nodeSelector:
      kubernetes.io/hostname: ebpf-bng-node-02
  ue:
    enabled: true
    image:
      name: free5gc/ueransim
      tag: "v4.2.2"
      pullPolicy: IfNotPresent
    nodeSelector:
      kubernetes.io/hostname: ebpf-bng-node-02
    test:
      connectivity:
        image: dtzar/helm-kubectl:3.19.0
