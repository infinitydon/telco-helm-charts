images:
  open5gs: gradiant/open5gs:2.7.5
  mongodb: mongo:6.0.26
  dbctl: gradiant/open5gs-dbctl:0.10.3
  ueransim: gradiant/ueransim:3.2.6
  toolbox: alpine:3.21.3
  n2Tunnel: ghcr.io/infinitydon/telco-n2-sctp-middleware:0.2.2
  kubeVip: ghcr.io/kube-vip/kube-vip:v1.2.2
  pullPolicy: IfNotPresent

imagePullSecrets: []
nodeSelector: { workload-type: general }

plmn:
  mcc: "001"
  mnc: "01"
  tac: 1

slice:
  sst: 1
  sd: "0x111111"

subscriber:
  imsi: "001010000000001"
  key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
  opc: "E8ED289DEBA952E4283B54E88E6183CA"
  amf: "8000"
  dnn: internet

gnb:
  nci: "0x000000010"

ueransim:
  gnbReplicas: 1
  ueReplicas: 1
  ueSupervisor:
    restartDelaySeconds: 2
    # nr-ue can stay alive after NAS registration failure; recycle it on T3510.
    restartOnRegistrationTimeout: true

ueNetwork:
  subnet: 10.45.0.0/16
  gateway: 10.45.0.1

multusDefaults:
  type: macvlan
  master: enp8s19
  mode: bridge
  ipam:
    type: static

multus:
  secure-n2: { subnet: 10.61.0.0/28, unmanaged: true }
  core-n2: { subnet: 10.61.0.16/28, unmanaged: true }
  n3: { subnet: 10.61.0.32/28 }
  n4: { subnet: 10.61.0.48/28 }
  n6: { subnet: 10.61.0.64/28 }
  rls: { subnet: 10.61.0.80/28 }

addresses:
  secureN2VIP: 10.61.0.1
  proxySecureN2: 10.61.0.2
  middlewareSecureN2: [10.61.0.3, 10.61.0.4]
  amfN2: 10.61.0.18
  middlewareCoreN2: [10.61.0.19, 10.61.0.20]
  upfN3: 10.61.0.34
  gnbN3: 10.61.0.35
  smfN4: 10.61.0.50
  upfN4: 10.61.0.51
  upfN6: 10.61.0.66
  dataN6: 10.61.0.67
  gnbRls: 10.61.0.82
  ueRls: 10.61.0.83

n2Tunnel:
  service:
    quicPort: 29502
    enrollmentPort: 8443
  pki:
    existingSecret: ""
    validityDays: 3650
  middleware:
    replicas: 2
    disruptionBudget:
      minAvailable: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    nodeSelector: { workload-type: general }
    vip:
      leaseDuration: 5
      renewDeadline: 3
      retryPeriod: 1
  proxy:
    clientCertificateValidityHours: 8760
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { cpu: 250m, memory: 128Mi }

mongodb:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

resources: {}
