apiVersion: v1
kind: Service
metadata:
  name: {{ include "n2lab.fullname" . }}-mongodb
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mongodb }
  ports: [{ name: mongodb, port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n2lab.fullname" . }}-mongodb
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mongodb }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mongodb }
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mongodb
          image: {{ .Values.images.mongodb }}
          args: ["--bind_ip_all"]
          ports: [{ name: mongodb, containerPort: 27017 }]
          readinessProbe: { tcpSocket: { port: mongodb }, initialDelaySeconds: 3, periodSeconds: 3 }
          volumeMounts: [{ name: data, mountPath: /data/db }]
      volumes:
        - name: data
          {{- if .Values.mongodb.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "n2lab.fullname" . }}-mongodb }
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.mongodb.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "n2lab.fullname" . }}-mongodb
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.mongodb.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.mongodb.persistence.size }} } }
{{- end }}
