name: Build N2 SCTP middleware

on:
  push:
    branches: [main]
    paths:
      - open5gs-ueransim-secure-n2/container/**
      - .github/workflows/build-n2-sctp-middleware.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: open5gs-ueransim-secure-n2/container
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/telco-n2-sctp-middleware:0.2.2
          provenance: true
          sbom: true
