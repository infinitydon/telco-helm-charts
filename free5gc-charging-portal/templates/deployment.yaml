{{- include "free5gc-charging-portal.validateImages" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "free5gc-charging-portal.fullname" . }}
  labels:
    {{- include "free5gc-charging-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "free5gc-charging-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "free5gc-charging-portal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "free5gc-charging-portal.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORTAL_TITLE
              value: {{ .Values.config.portalTitle | quote }}
            - name: PORTAL_MODE
              value: {{ .Values.config.portalMode | quote }}
            - name: MONGO_URI
              value: {{ .Values.config.mongoUri | quote }}
            - name: MONGO_DB
              value: {{ .Values.config.mongoDb | quote }}
            - name: CHF_BASE_URL
              value: {{ .Values.config.chfBaseUrl | quote }}
            - name: CHF_NOTIFY_ENABLED
              value: {{ .Values.config.chfNotifyEnabled | quote }}
            - name: END_USER_SELF_TOPUP
              value: {{ .Values.config.endUserSelfTopup | quote }}
            - name: TRUSTED_SUBSCRIBER_HEADER_ENABLED
              value: {{ .Values.config.trustedSubscriberHeaderEnabled | quote }}
            - name: TRUSTED_SUBSCRIBER_HEADER
              value: {{ .Values.config.trustedSubscriberHeader | quote }}
            - name: SUBSCRIBER_BINDINGS_JSON
              value: {{ .Values.config.subscriberBindingsJson | quote }}
            - name: DEFAULT_SUBSCRIBER_SUPI
              value: {{ .Values.config.defaultSubscriberSupi | quote }}
            - name: OPERATOR_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "free5gc-charging-portal.secretName" . }}
                  key: {{ .Values.auth.operatorPinKey }}
            - name: CHF_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "free5gc-charging-portal.secretName" . }}
                  key: {{ .Values.auth.chfBearerTokenKey }}
                  optional: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
