apiVersion: v1
kind: Pod
metadata:
  name: {{ include "free5gc-charging-portal.fullname" . }}-smoke
  labels:
    {{- include "free5gc-charging-portal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: curl
      image: curlimages/curl:8.20.0
      command:
        - sh
        - -ceu
        - curl -fsS http://{{ include "free5gc-charging-portal.fullname" . }}:{{ .Values.service.port }}/healthz
