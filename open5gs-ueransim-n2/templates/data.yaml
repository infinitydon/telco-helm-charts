apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n2lab.fullname" . }}-data
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: data }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: data }
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "n2lab.fullname" . }}-n6","interface":"n6","ips":["{{ .Values.addresses.dataN6 }}/24"]}]
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: data
          image: {{ .Values.images.open5gs }}
          securityContext: { privileged: true, runAsUser: 0 }
          command: ["/bin/sh", "-ec"]
          args: ["sysctl -w net.ipv4.ip_forward=1; ip route replace {{ .Values.ueNetwork.subnet }} via {{ .Values.addresses.upfN6 }} dev n6; iptables-legacy -t nat -C POSTROUTING -s {{ .Values.ueNetwork.subnet }} -o eth0 -j MASQUERADE 2>/dev/null || iptables-legacy -t nat -A POSTROUTING -s {{ .Values.ueNetwork.subnet }} -o eth0 -j MASQUERADE; sleep infinity"]
