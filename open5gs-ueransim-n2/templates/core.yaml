{{- $root := . }}
{{- $functions := list "nrf" "ausf" "udm" "udr" "pcf" "nssf" "amf" "smf" "upf" }}
{{- range $name := $functions }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "n2lab.fullname" $root }}-{{ $name }}
  labels:
    {{- include "n2lab.labels" $root | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - { name: sbi, port: 7777, targetPort: 7777, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n2lab.fullname" $root }}-{{ $name }}
  labels:
    {{- include "n2lab.labels" $root | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configs.yaml") $root | sha256sum }}
        {{- if eq $name "amf" }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "n2lab.fullname" $root }}-core-n2","interface":"core-n2"}]
        {{- else if eq $name "smf" }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "n2lab.fullname" $root }}-n4","interface":"n4","ips":["{{ $root.Values.addresses.smfN4 }}/28"]}]
        {{- else if eq $name "upf" }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "n2lab.fullname" $root }}-n3","interface":"n3","ips":["{{ $root.Values.addresses.upfN3 }}/28"]},{"name":"{{ include "n2lab.fullname" $root }}-n4","interface":"n4","ips":["{{ $root.Values.addresses.upfN4 }}/28"]},{"name":"{{ include "n2lab.fullname" $root }}-n6","interface":"n6","ips":["{{ $root.Values.addresses.upfN6 }}/28"]}]
        {{- end }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne $name "nrf" }}
      initContainers:
        {{- if eq $name "amf" }}
        - name: configure-core-n2
          image: {{ $root.Values.images.toolbox }}
          securityContext: { runAsUser: 0, capabilities: { add: [NET_ADMIN] } }
          command: ["/bin/sh", "-ec"]
          args: ["ip address add {{ $root.Values.addresses.amfN2 }}/28 dev core-n2"]
        {{- end }}
        - name: wait-for-nrf
          image: {{ $root.Values.images.toolbox }}
          command: ["/bin/sh", "-ec"]
          args: ["until nc -z {{ include "n2lab.fullname" $root }}-nrf 7777; do sleep 2; done"]
        {{- if or (eq $name "udr") (eq $name "pcf") }}
        - name: wait-for-mongodb
          image: {{ $root.Values.images.mongodb }}
          command: ["/bin/sh", "-ec"]
          args: ["until mongosh mongodb://{{ include "n2lab.fullname" $root }}-mongodb/open5gs --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do sleep 2; done"]
        {{- end }}
        {{- if eq $name "upf" }}
        - name: create-tun
          image: {{ $root.Values.images.open5gs }}
          securityContext: { privileged: true, runAsUser: 0 }
          command: ["/bin/sh", "-ec"]
          args: ["ip tuntap add name ogstun mode tun 2>/dev/null || true; ip addr replace {{ $root.Values.ueNetwork.gateway }}/16 dev ogstun; ip link set ogstun up; sysctl -w net.ipv4.ip_forward=1; ip route replace default via {{ $root.Values.addresses.dataN6 }} dev n6 table 65; ip rule add priority 100 from {{ $root.Values.ueNetwork.subnet }} table 65 2>/dev/null || true"]
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $root.Values.images.open5gs }}
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          command: ["open5gs-{{ $name }}d"]
          {{- if or (eq $name "udr") (eq $name "pcf") }}
          env:
            - name: DB_URI
              value: mongodb://{{ include "n2lab.fullname" $root }}-mongodb/open5gs
          {{- end }}
          {{- if eq $name "upf" }}
          securityContext: { privileged: true, runAsUser: 0 }
          {{- end }}
          volumeMounts: [{ name: config, mountPath: /opt/open5gs/etc/open5gs/{{ $name }}.yaml, subPath: {{ $name }}.yaml }]
          resources: {{ toYaml $root.Values.resources | nindent 12 }}
      volumes: [{ name: config, configMap: { name: {{ include "n2lab.fullname" $root }}-configs } }]
{{- end }}
