{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "magma-ebpf.fullname" . }}
  labels:
    {{- include "magma-ebpf.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "magma-ebpf.fullname" . }}
  labels:
    {{- include "magma-ebpf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "magma-ebpf.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "magma-ebpf.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.rbac.create .Values.rbac.clusterAdmin.create }}
---
{{- end }}
{{- if and .Values.rbac.create .Values.rbac.clusterAdmin.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "magma-ebpf.fullname" . }}-cluster-admin
  labels:
    {{- include "magma-ebpf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "magma-ebpf.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
