apiVersion: v1
kind: Pod
metadata:
  name: {{ include "magma-ebpf.fullname" . }}-preflight
  labels:
    {{- include "magma-ebpf.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "magma-ebpf.serviceAccountName" . }}
  containers:
    - name: preflight
      image: {{ .Values.image.test | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/bin/sh", "/chart-config/verify.sh"]
      volumeMounts:
        - name: config
          mountPath: /chart-config
  volumes:
    - name: config
      configMap:
        name: {{ include "magma-ebpf.fullname" . }}-config
        defaultMode: 0755
