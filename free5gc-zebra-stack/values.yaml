labNodeSelector:
  kubernetes.io/hostname: ebpf-bng-node-02

stackSmokeTest:
  enabled: false
  image: dtzar/helm-kubectl:3.19.0
  pingTarget: 8.8.8.8
  ueInterface: uesimtun0
  installIperf3: true
  iperf3:
    enabled: true
    seconds: 5
    port: 5201
    failOnError: false

n6Gateway:
  enabled: true
  mode: macvlan
  image:
    repository: alpine
    tag: "3.22.1"
    pullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-02
  interfaceName: n6gw
  masterIf: enp8s22
  networkName: ""
  gatewayIf: free5gc-n6-gw
  gatewayIp: 10.201.60.1
  cidr: 24
  n6Subnet: 10.201.60.0/24
  ueSubnet: 10.60.128.0/17
  zebraDownlinkIp: 10.201.60.11
  uplinkIf: eth0
  iperf3:
    enabled: true
    port: 5201

zebra:
  enabled: true
  image:
    repository: ghcr.io/infinitydon/zebra-sh
    tag: "26.7.4-nightly20260714"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-02
  dataplane:
    mode: macvlan
  interfaces:
    n3:
      name: n3
      networkName: ""
      masterIf: enp8s20
      device: enp8s23
      ip: 10.201.30.10
      cidr: 24
    n4:
      name: n4
      networkName: ""
      ip: 10.201.40.20
      cidr: 24
    n6:
      name: n6
      networkName: ""
      masterIf: enp8s22
      device: enp8s24
    n6ul:
      name: n6ul
      networkName: ""
      ip: 10.201.60.10
      cidr: 24
      vrf: 2
    n6dl:
      name: n6dl
      networkName: ""
      ip: 10.201.60.11
      cidr: 24
      vrf: 1
  gatewayIp: 10.201.60.1
  uePool: 10.60.128.0/17
  bgp:
    as: 65001
    routerId: 1.1.1.1
  mup:
    controllerAddress: 2001:db8::1
    networkInstance: internet
    pfcp:
      listenAddress: 10.201.40.20
      port: 8805
    vrfs:
      downlink:
        name: mobile-dl
        rd: "65000:101"
      uplink:
        name: mobile-ul
        rd: "65000:100"
  resources: {}

free5gc:
  global:
    name: free5gc
    projectName: free5gc
    userPlaneArchitecture: single
    uesubnet: 10.60.0.0/16
    sbi:
      scheme: http
    amf:
      multus:
        enabled: true
        n2if:
          ipAddress: 10.201.10.10
        n2network:
          enabled: true
          name: n2network
          type: macvlan
          masterIf: enp8s19
          subnetIP: 10.201.10.0
          cidr: 24
          gatewayIP: 10.201.10.1
          excludeIP: 10.201.10.1
      service:
        ngap:
          enabled: false
    smf:
      multus:
        enabled: true
        n4if:
          ipAddress: 10.201.40.10
        n4network:
          enabled: true
          name: n4network
          type: macvlan
          masterIf: enp8s21
          subnetIP: 10.201.40.0
          cidr: 24
          gatewayIP: 10.201.40.1
          excludeIP: 10.201.40.1
    upf:
      multus:
        enabled: true
        upf:
          n3if:
            ipAddress: 10.201.30.10
          n4if:
            ipAddress: 10.201.40.20
          n6if:
            ipAddress: 10.201.60.10
        n3network:
          enabled: true
          name: n3network
          type: macvlan
          masterIf: enp8s20
          subnetIP: 10.201.30.0
          cidr: 24
          gatewayIP: 10.201.30.1
          excludeIP: 10.201.30.1
        n4network:
          enabled: true
          name: n4network
          type: macvlan
          masterIf: enp8s21
          subnetIP: 10.201.40.0
          cidr: 24
          gatewayIP: 10.201.40.1
          excludeIP: 10.201.40.1
        n6network:
          enabled: true
          name: n6network
          type: macvlan
          masterIf: enp8s22
          subnetIP: 10.201.60.0
          cidr: 24
          gatewayIP: 10.201.60.1
          excludeIP: 10.201.60.1

  deployMongoDb: true
  deployAmf: true
  deployAusf: true
  deployChf: false
  deployN3iwf: false
  deployNef: false
  deployNrf: true
  deployNssf: true
  deployPcf: true
  deploySmf: true
  deployUdm: true
  deployUdr: true
  deployUpf: false
  deployWebui: true
  deployDbPython: false

  mongodb:
    fullnameOverride: mongodb
    auth:
      enabled: false
    persistence:
      enabled: false
    nodeSelector:
      kubernetes.io/hostname: ebpf-bng-node-02

  free5gc-amf:
    amf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-ausf:
    ausf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-nrf:
    nrf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-nssf:
    nssf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-pcf:
    pcf:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-smf:
    smf:
      image:
        name: free5gc/smf
        tag: "v4.2.2"
        pullPolicy: IfNotPresent
      imagePullSecrets: []
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
      configuration:
        logger:
          reportCaller: true
        urrConfiguration: |-
          urrPeriod: 10
          urrThreshold: 1000
          requestedUnit: 1048576
        ueRoutingInfo: |-
          UE1:
            members:
            - imsi-208930000000001
            topology:
              - A: gNB1
                B: UPF
  free5gc-udm:
    udm:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-udr:
    udr:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-upf:
    upf:
      configmap:
        wrapperAdditionalCommands: |
          echo 1 > /proc/sys/net/ipv4/ip_forward
          echo "[wrapper] IPv4 forwarding: $(cat /proc/sys/net/ipv4/ip_forward)"
      podSecurityContext:
        sysctls: []
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        capabilities:
          add: ["NET_ADMIN"]
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 2Gi
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02
  free5gc-webui:
    webui:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-02

