{{- if .Values.subscriberProvisioning.enabled -}}
{{- if or (eq .Values.subscriberProvisioning.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.subscriberProvisioning.image.tag) -}}
{{- fail "subscriberProvisioning.image.tag must not use latest" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-subscriber-provisioning-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: subscriber-provisioning
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subscriber-provisioning
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.labNodeSelector | nindent 8 }}
      containers:
        - name: provision
          image: "{{ .Values.subscriberProvisioning.image.repository }}:{{ .Values.subscriberProvisioning.image.tag }}"
          imagePullPolicy: {{ .Values.subscriberProvisioning.image.pullPolicy }}
          env:
            - name: WEBUI_BASE_URL
              value: {{ .Values.subscriberProvisioning.webuiBaseUrl | quote }}
            - name: WEBUI_USERNAME
              value: {{ .Values.subscriberProvisioning.username | quote }}
            - name: WEBUI_PASSWORD
              value: {{ .Values.subscriberProvisioning.password | quote }}
            - name: UE_ID
              value: {{ .Values.subscriberProvisioning.subscriber.ueId | quote }}
            - name: PLMN_ID
              value: {{ .Values.subscriberProvisioning.subscriber.plmnID | quote }}
            - name: SUBSCRIBER_JSON
              value: {{ .Values.subscriberProvisioning.subscriber | toJson | quote }}
          command:
            - sh
            - -ceu
            - |
              login_payload=$(printf '{"username":"%s","password":"%s"}' "$WEBUI_USERNAME" "$WEBUI_PASSWORD")
              for i in $(seq 1 60); do
                login_response="$(curl -fsS -H 'Content-Type: application/json' -d "$login_payload" "$WEBUI_BASE_URL/api/login" || true)"
                token="$(printf '%s' "$login_response" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
                if [ -n "$token" ]; then
                  break
                fi
                sleep 2
              done
              test -n "$token"
              url="$WEBUI_BASE_URL/api/subscriber/$UE_ID/$PLMN_ID"
              code="$(curl -sS -o /tmp/subscriber-get.json -w '%{http_code}' -H "Token: $token" "$url" || true)"
              if [ "$code" = "200" ]; then
                curl -fsS -X PUT -H 'Content-Type: application/json' -H "Token: $token" --data "$SUBSCRIBER_JSON" "$url"
              else
                curl -fsS -X POST -H 'Content-Type: application/json' -H "Token: $token" --data "$SUBSCRIBER_JSON" "$url"
              fi
{{- end }}
