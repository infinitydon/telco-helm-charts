{{- if .Values.zebra.enabled }}
{{- if or (eq .Values.zebra.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.zebra.image.tag) -}}
{{- fail "zebra.image.tag must not use latest" -}}
{{- end }}
{{- $mode := .Values.zebra.dataplane.mode }}
{{- $n6Mode := default "macvlan" .Values.zebra.interfaces.n6.mode }}
{{- $n3Name := default (printf "n3network-%s-ueransim" .Release.Name) .Values.zebra.interfaces.n3.networkName }}
{{- $n4Name := default (printf "n4network-%s-free5gc-smf" .Release.Name) .Values.zebra.interfaces.n4.networkName }}
{{- $n3HostName := printf "%s-zebra-n3-hostdev" .Release.Name }}
{{- $n6Name := default (printf "%s-zebra-n6" .Release.Name) .Values.zebra.interfaces.n6.networkName }}
{{- if eq $mode "hostDevice" }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $n3HostName }}
  labels:
    app.kubernetes.io/name: zebra
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "host-device",
          "device": {{ .Values.zebra.interfaces.n3.device | quote }},
          "ipam": {
            "type": "static",
            "addresses": [
              { "address": "{{ .Values.zebra.interfaces.n3.ip }}/{{ .Values.zebra.interfaces.n3.cidr }}" }
            ]
          }
        },
        {
          "type": "tuning",
          "mtu": 1500
        }
      ]
    }
---
{{- end }}
{{- if eq $n6Mode "hostDevice" }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $n6Name }}
  labels:
    app.kubernetes.io/name: zebra
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "host-device",
          "device": {{ .Values.zebra.interfaces.n6.device | quote }}
        },
        {
          "type": "tuning",
          "mtu": 1500
        }
      ]
    }
---
{{- else }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $n6Name }}
  labels:
    app.kubernetes.io/name: zebra
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "macvlan",
          "master": {{ .Values.zebra.interfaces.n6.masterIf | quote }},
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "addresses": [
              { "address": "{{ .Values.zebra.interfaces.n6.ip }}/{{ .Values.zebra.interfaces.n6.cidr }}" }
            ]
          }
        },
        {
          "type": "tuning",
          "mtu": 1500
        }
      ]
    }
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-zebra-config
  labels:
    app.kubernetes.io/name: zebra
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  upf-ports.json: |
    {
      "ports": [
        { "name": "{{ .Values.zebra.interfaces.n3.name }}", "l3": true },
        { "name": "{{ .Values.zebra.interfaces.n6.name }}", "l3": true, "vrf": {{ .Values.zebra.interfaces.n6.vrf }} }
      ]
    }
  zebra-rs.yaml: |
    system:
      cradle:
        enabled: true
    vrf:
    - name: {{ .Values.zebra.mup.vrf.name }}
    interface:
    - if-name: lo
      ipv6:
        address: {{ .Values.zebra.mup.controllerAddress }}/128
    - if-name: {{ .Values.zebra.interfaces.n3.name }}
      ipv4:
        address: {{ .Values.zebra.interfaces.n3.ip }}/{{ .Values.zebra.interfaces.n3.cidr }}
    - if-name: {{ .Values.zebra.interfaces.n6.name }}
      vrf: {{ .Values.zebra.mup.vrf.name }}
      ipv4:
        address: {{ .Values.zebra.interfaces.n6.ip }}/{{ .Values.zebra.interfaces.n6.cidr }}
    router:
      static:
        vrf:
        - name: {{ .Values.zebra.mup.vrf.name }}
          ipv4:
            route:
            - prefix: 0.0.0.0/0
              nexthop:
              - address: {{ .Values.zebra.gatewayIp }}
      bgp:
        global:
          as: {{ .Values.zebra.bgp.as }}
          router-id: {{ .Values.zebra.bgp.routerId }}
        vrf:
        - name: {{ .Values.zebra.mup.vrf.name }}
          rd: {{ .Values.zebra.mup.vrf.rd | quote }}
          afi-safi:
            mup:
              dataplane: gtp
              route:
              - type: st1
                network-instance: {{ .Values.zebra.mup.networkInstance }}
              - type: st2
                network-instance: {{ .Values.zebra.mup.networkInstance }}
        mup-c:
          enabled: true
          controller-address: {{ .Values.zebra.mup.controllerAddress }}
          pfcp:
            listen-address: {{ .Values.zebra.mup.pfcp.listenAddress | quote }}
            port: {{ .Values.zebra.mup.pfcp.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-zebra
  labels:
    app.kubernetes.io/name: zebra
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zebra
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zebra
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {{- if eq $mode "hostDevice" }}
            {"name":{{ $n3HostName | quote }},"interface":{{ .Values.zebra.interfaces.n3.name | quote }}},
            {{- else }}
            {"name":{{ $n3Name | quote }},"interface":{{ .Values.zebra.interfaces.n3.name | quote }},"ips":["{{ .Values.zebra.interfaces.n3.ip }}/{{ .Values.zebra.interfaces.n3.cidr }}"]},
            {{- end }}
            {"name":{{ $n4Name | quote }},"interface":{{ .Values.zebra.interfaces.n4.name | quote }},"ips":["{{ .Values.zebra.interfaces.n4.ip }}/{{ .Values.zebra.interfaces.n4.cidr }}"]},
            {{- if eq $n6Mode "hostDevice" }}
            {"name":{{ $n6Name | quote }},"interface":{{ .Values.zebra.interfaces.n6.name | quote }}}
            {{- else }}
            {"name":{{ $n6Name | quote }},"interface":{{ .Values.zebra.interfaces.n6.name | quote }}}
            {{- end }}
          ]
    spec:
      nodeSelector:
        {{- toYaml .Values.zebra.nodeSelector | nindent 8 }}
      {{- with .Values.zebra.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $n6Mode "hostDevice" }}
      initContainers:
        - name: setup-n6-interface
          image: "{{ .Values.zebra.image.repository }}:{{ .Values.zebra.image.tag }}"
          imagePullPolicy: {{ .Values.zebra.image.pullPolicy }}
          command: ["sh"]
          args:
            - -ceu
            - |
              ip link set {{ .Values.zebra.interfaces.n6.name }} up
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
      {{- end }}
      containers:
        - name: cradle
          image: "{{ .Values.zebra.image.repository }}:{{ .Values.zebra.image.tag }}"
          imagePullPolicy: {{ .Values.zebra.image.pullPolicy }}
          command: ["cradle"]
          args: ["serve", "--config", "/etc/zebra-rs/upf-ports.json", "--grpc", "unix:cradle/grpc"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE", "SYS_ADMIN"]
          volumeMounts:
            - name: config
              mountPath: /etc/zebra-rs/upf-ports.json
              subPath: upf-ports.json
        - name: zebra
          image: "{{ .Values.zebra.image.repository }}:{{ .Values.zebra.image.tag }}"
          imagePullPolicy: {{ .Values.zebra.image.pullPolicy }}
          command: ["sh"]
          args: ["-c", "sleep 3; exec zebra-rs --yang-path /etc/zebra-rs/yang --config-file /etc/zebra-rs/zebra-rs.yaml --log-output stdout"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE", "SYS_ADMIN"]
          ports:
            - name: pfcp
              containerPort: {{ .Values.zebra.mup.pfcp.port }}
              protocol: UDP
            - name: bgp
              containerPort: 179
              protocol: TCP
          resources:
            {{- toYaml .Values.zebra.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/zebra-rs/zebra-rs.yaml
              subPath: zebra-rs.yaml
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-zebra-config
{{- end }}
