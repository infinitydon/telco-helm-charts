{{- if .Values.n6Gateway.enabled }}
{{- if or (eq .Values.n6Gateway.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.n6Gateway.image.tag) -}}
{{- fail "n6Gateway.image.tag must not use latest" -}}
{{- end }}
{{- $gwName := default (printf "%s-n6-gateway" .Release.Name) .Values.n6Gateway.networkName }}
{{- if eq .Values.n6Gateway.mode "macvlan" }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $gwName }}
  labels:
    app.kubernetes.io/name: n6-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "macvlan",
          "master": {{ .Values.n6Gateway.masterIf | quote }},
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "addresses": [
              { "address": "{{ .Values.n6Gateway.gatewayIp }}/{{ .Values.n6Gateway.cidr }}" }
            ]
          }
        },
        {
          "type": "tuning",
          "mtu": 1500
        }
      ]
    }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-n6-gateway
  labels:
    app.kubernetes.io/name: n6-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n6-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n6-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if eq .Values.n6Gateway.mode "macvlan" }}
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name":{{ $gwName | quote }},"interface":{{ .Values.n6Gateway.interfaceName | quote }}}
          ]
      {{- end }}
    spec:
      {{- if eq .Values.n6Gateway.mode "hostNetwork" }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.n6Gateway.nodeSelector | nindent 8 }}
      containers:
        - name: n6-gateway
          image: "{{ .Values.n6Gateway.image.repository }}:{{ .Values.n6Gateway.image.tag }}"
          imagePullPolicy: {{ .Values.n6Gateway.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: MODE
              value: {{ .Values.n6Gateway.mode | quote }}
            - name: MASTER_IF
              value: {{ .Values.n6Gateway.masterIf | quote }}
            - name: GATEWAY_IF
              value: {{ ternary .Values.n6Gateway.gatewayIf .Values.n6Gateway.interfaceName (eq .Values.n6Gateway.mode "hostNetwork") | quote }}
            - name: GATEWAY_CIDR
              value: "{{ .Values.n6Gateway.gatewayIp }}/{{ .Values.n6Gateway.cidr }}"
            - name: UE_SUBNET
              value: {{ .Values.n6Gateway.ueSubnet | quote }}
            - name: ZEBRA_DL_IP
              value: {{ .Values.n6Gateway.zebraDownlinkIp | quote }}
            - name: UPLINK_IF
              value: {{ .Values.n6Gateway.uplinkIf | quote }}
            - name: IPERF3_ENABLED
              value: {{ .Values.n6Gateway.iperf3.enabled | quote }}
            - name: IPERF3_PORT
              value: {{ .Values.n6Gateway.iperf3.port | quote }}
          ports:
            - name: iperf3
              containerPort: {{ .Values.n6Gateway.iperf3.port }}
              protocol: TCP
          command:
            - sh
            - -ceu
            - |
              apk add --no-cache iproute2 iptables iperf3

              cleanup() {
                iptables -t nat -D POSTROUTING -s "${UE_SUBNET}" -o "${UPLINK_IF}" -j MASQUERADE 2>/dev/null || true
                iptables -D FORWARD -i "${GATEWAY_IF}" -o "${UPLINK_IF}" -j ACCEPT 2>/dev/null || true
                iptables -D FORWARD -i "${UPLINK_IF}" -o "${GATEWAY_IF}" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
                if [ "${MODE}" = "hostNetwork" ]; then
                  ip link delete "${GATEWAY_IF}" 2>/dev/null || true
                fi
              }
              trap cleanup EXIT INT TERM

              if [ "${MODE}" = "hostNetwork" ] && ! ip link show "${GATEWAY_IF}" >/dev/null 2>&1; then
                ip link add "${GATEWAY_IF}" link "${MASTER_IF}" type macvlan mode bridge
              fi

              ip addr replace "${GATEWAY_CIDR}" dev "${GATEWAY_IF}"
              ip link set "${GATEWAY_IF}" up

              sysctl -w net.ipv4.ip_forward=1
              ip route replace "${UE_SUBNET}" via "${ZEBRA_DL_IP}" dev "${GATEWAY_IF}"

              iptables -C FORWARD -i "${GATEWAY_IF}" -o "${UPLINK_IF}" -j ACCEPT 2>/dev/null || \
                iptables -A FORWARD -i "${GATEWAY_IF}" -o "${UPLINK_IF}" -j ACCEPT
              iptables -C FORWARD -i "${UPLINK_IF}" -o "${GATEWAY_IF}" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \
                iptables -A FORWARD -i "${UPLINK_IF}" -o "${GATEWAY_IF}" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
              iptables -t nat -C POSTROUTING -s "${UE_SUBNET}" -o "${UPLINK_IF}" -j MASQUERADE 2>/dev/null || \
                iptables -t nat -A POSTROUTING -s "${UE_SUBNET}" -o "${UPLINK_IF}" -j MASQUERADE

              if [ "${IPERF3_ENABLED}" = "true" ]; then
                iperf3 -s -B "${GATEWAY_CIDR%/*}" -p "${IPERF3_PORT}" >/tmp/iperf3-server.log 2>&1 &
              fi

              echo "N6 gateway ${GATEWAY_CIDR} is forwarding ${UE_SUBNET} through ${UPLINK_IF}"
              while true; do sleep 3600; done
{{- end }}
