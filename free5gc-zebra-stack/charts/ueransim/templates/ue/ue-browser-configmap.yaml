{{- if and .Values.ue.enabled .Values.ueBrowser.enabled }}
{{- if or (eq .Values.ueBrowser.browser.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.ueBrowser.browser.image.tag) }}
{{- fail "ueBrowser.browser.image.tag must not use latest" }}
{{- end }}
{{- if or (eq .Values.ueBrowser.proxy.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.ueBrowser.proxy.image.tag) }}
{{- fail "ueBrowser.proxy.image.tag must not use latest" }}
{{- end }}
{{- if and .Values.ueBrowser.internetProxy.enabled (or (eq .Values.ueBrowser.internetProxy.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.ueBrowser.internetProxy.image.tag)) }}
{{- fail "ueBrowser.internetProxy.image.tag must not use latest" }}
{{- end }}
{{- if and .Values.ueBrowser.internetProxy.enabled (or (eq .Values.ueBrowser.routeManager.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.ueBrowser.routeManager.image.tag)) }}
{{- fail "ueBrowser.routeManager.image.tag must not use latest" }}
{{- end }}
{{- if and .Values.ueBrowser.binder.enabled (or (eq .Values.ueBrowser.binder.image.tag "latest") (regexMatch "(:latest$|^latest$)" .Values.ueBrowser.binder.image.tag)) }}
{{- fail "ueBrowser.binder.image.tag must not use latest" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ueransim.fullname" . }}-ue-browser-proxy
  labels:
    {{- include "ueransim.labels" . | nindent 4 }}
data:
  chromium: |
    #!/usr/bin/env bash
    set -euo pipefail

    if [ "${UERANSIM_BINDER_ENABLED:-false}" != "true" ]; then
      exec /usr/bin/chromium "$@"
    fi

    iface="${UERANSIM_BINDER_INTERFACE:-uesimtun0}"
    binder_dir="${UERANSIM_BINDER_DIR:-/opt/ueransim-binder}"
    while ! ip link show "$iface" >/dev/null 2>&1; do
      echo "waiting for $iface before launching Chromium through nr-binder"
      sleep 2
    done
    ue_ip="$(ip -4 -o addr show "$iface" | awk '{ split($4, a, "/"); print a[1]; exit }')"
    if [ -z "$ue_ip" ]; then
      echo "could not determine UE IP on $iface" >&2
      exit 1
    fi
    cd "$binder_dir"
    exec ./nr-binder "$ue_ip" /usr/bin/chromium "$@"

  default.conf: |
    server {
      listen {{ .Values.ueBrowser.proxy.port }};
      server_name _;

      location / {
        proxy_pass {{ .Values.ueBrowser.portalServiceUrl }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header {{ .Values.ueBrowser.trustedSubscriberHeader }} "{{ .Values.ueBrowser.subscriberSupi }}";
      }
    }
  tinyproxy.conf: |
    User {{ .Values.ueBrowser.internetProxy.user }}
    Group {{ .Values.ueBrowser.internetProxy.group }}
    Port {{ .Values.ueBrowser.internetProxy.port }}
    Listen 127.0.0.1
    Timeout {{ .Values.ueBrowser.internetProxy.timeoutSeconds }}
    DefaultErrorFile "/usr/share/tinyproxy/default.html"
    StatFile "/usr/share/tinyproxy/stats.html"
    LogLevel Info
    MaxClients {{ .Values.ueBrowser.internetProxy.maxClients }}
    Allow 127.0.0.1
    ConnectPort 443
    ConnectPort 563
{{- end }}
