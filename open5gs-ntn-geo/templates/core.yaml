{{- $root := . -}}
{{- range $name := list "nrf" "ausf" "udm" "udr" "pcf" "nssf" "amf" "smf" "upf" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ntn.fullname" $root }}-{{ $name }}
spec:
  selector: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
  ports: [{ name: sbi, port: 7777, targetPort: 7777 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ntn.fullname" $root }}-{{ $name }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configs.yaml") $root | sha256sum }}
        {{- if eq $name "amf" }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "ntn.fullname" $root }}-n2","interface":"n2","ips":["{{ $root.Values.addresses.amfN2 }}/{{ $root.Values.prefixLength }}"]}]
        {{- else if eq $name "smf" }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "ntn.fullname" $root }}-n4","interface":"n4","ips":["{{ $root.Values.addresses.smfN4 }}/{{ $root.Values.prefixLength }}"]}]
        {{- else if eq $name "upf" }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "ntn.fullname" $root }}-n3","interface":"n3","ips":["{{ $root.Values.addresses.upfN3 }}/{{ $root.Values.prefixLength }}"]},{"name":"{{ include "ntn.fullname" $root }}-n4","interface":"n4","ips":["{{ $root.Values.addresses.upfN4 }}/{{ $root.Values.prefixLength }}"]},{"name":"{{ include "ntn.fullname" $root }}-n6","interface":"n6","ips":["{{ $root.Values.addresses.upfN6 }}/{{ $root.Values.prefixLength }}"]}]
        {{- end }}
    spec:
      nodeSelector: {{- toYaml $root.Values.nodeSelector | nindent 8 }}
      {{- if ne $name "nrf" }}
      initContainers:
        - name: wait-for-nrf
          image: {{ $root.Values.image.toolbox }}
          command: ["/bin/sh", "-ec"]
          args: ["until nc -z {{ include "ntn.fullname" $root }}-nrf 7777; do sleep 2; done"]
        {{- if or (eq $name "udr") (eq $name "pcf") }}
        - name: wait-for-mongodb
          image: {{ $root.Values.image.mongodb }}
          env: [{ name: DB_URI, value: mongodb://{{ include "ntn.fullname" $root }}-mongodb/open5gs }]
          command: ["/bin/sh", "-ec"]
          args: ["until mongosh \"$DB_URI\" --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 2; done"]
        {{- end }}
        {{- if eq $name "upf" }}
        - name: create-tun
          image: {{ $root.Values.image.open5gs }}
          securityContext: { privileged: true, runAsUser: 0, runAsGroup: 0, capabilities: { add: [NET_ADMIN] } }
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              ip link show ogstun >/dev/null 2>&1 || ip tuntap add name ogstun mode tun;
              ip addr replace {{ $root.Values.ueGateway }}/{{ $root.Values.uePrefixLength }} dev ogstun;
              ip link set ogstun up;
              sysctl -w net.ipv4.ip_forward=1;
              sysctl -w net.ipv4.conf.all.rp_filter=0;
              ip rule del priority 100 from {{ $root.Values.ueSubnet }} table 65 2>/dev/null || true;
              ip rule add priority 100 from {{ $root.Values.ueSubnet }} table 65;
              ip route replace default via {{ $root.Values.addresses.dataN6 }} dev n6 table 65
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $root.Values.image.open5gs }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["open5gs-{{ $name }}d"]
          {{- if or (eq $name "udr") (eq $name "pcf") }}
          env: [{ name: DB_URI, value: mongodb://{{ include "ntn.fullname" $root }}-mongodb/open5gs }]
          {{- end }}
          {{- if eq $name "upf" }}
          securityContext: { privileged: true, runAsUser: 0, runAsGroup: 0, capabilities: { add: [NET_ADMIN] } }
          {{- end }}
          volumeMounts: [{ name: config, mountPath: /opt/open5gs/etc/open5gs/{{ $name }}.yaml, subPath: {{ $name }}.yaml }]
          resources: {{- toYaml $root.Values.coreResources | nindent 12 }}
      volumes: [{ name: config, configMap: { name: {{ include "ntn.fullname" $root }}-configs } }]
{{- end }}
