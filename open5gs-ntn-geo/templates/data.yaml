apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ntn.fullname" . }}-data
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: data }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: data }
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "ntn.fullname" . }}-n6","interface":"n6","ips":["{{ .Values.addresses.dataN6 }}/{{ .Values.prefixLength }}"]}]
    spec:
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: data
          image: {{ .Values.image.open5gs }}
          securityContext: { privileged: true, runAsUser: 0, runAsGroup: 0, capabilities: { add: [NET_ADMIN] } }
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              sysctl -w net.ipv4.ip_forward=1;
              sysctl -w net.ipv4.conf.all.rp_filter=0;
              ip route replace {{ .Values.ueSubnet }} via {{ .Values.addresses.upfN6 }} dev n6;
              iptables-legacy -t nat -C POSTROUTING -s {{ .Values.ueSubnet }} -o eth0 -j MASQUERADE 2>/dev/null ||
              iptables-legacy -t nat -A POSTROUTING -s {{ .Values.ueSubnet }} -o eth0 -j MASQUERADE;
              sleep infinity
