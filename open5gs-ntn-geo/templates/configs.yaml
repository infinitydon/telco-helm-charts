apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ntn.fullname" . }}-configs
data:
  nrf.yaml: |
    logger: { level: info }
    nrf:
      serving: [{ plmn_id: { mcc: {{ .Values.plmn.mcc | quote }}, mnc: {{ .Values.plmn.mnc | quote }} } }]
      sbi: { server: [{ dev: eth0, port: 7777 }] }
  ausf.yaml: |
    logger: { level: info }
    ausf: { sbi: { server: [{ dev: eth0, port: 7777 }], client: { nrf: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777 }] } } }
  udm.yaml: |
    logger: { level: info }
    udm: { sbi: { server: [{ dev: eth0, port: 7777 }], client: { nrf: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777 }] } } }
  udr.yaml: |
    db_uri: mongodb://{{ include "ntn.fullname" . }}-mongodb/open5gs
    logger: { level: info }
    udr: { sbi: { server: [{ dev: eth0, port: 7777 }], client: { nrf: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777 }] } } }
  pcf.yaml: |
    db_uri: mongodb://{{ include "ntn.fullname" . }}-mongodb/open5gs
    logger: { level: info }
    pcf: { sbi: { server: [{ dev: eth0, port: 7777 }], client: { nrf: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777 }] } } }
  nssf.yaml: |
    logger: { level: info }
    nssf:
      sbi:
        server: [{ dev: eth0, port: 7777 }]
        client:
          nrf: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777 }]
          nsi: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777, s_nssai: { sst: {{ .Values.subscriber.sst }}, sd: {{ .Values.subscriber.sd }} } }]
  amf.yaml: |
    logger: { level: info }
    amf:
      sbi: { server: [{ dev: eth0, port: 7777 }], client: { nrf: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777 }] } }
      ngap: { server: [{ address: {{ .Values.addresses.amfN2 }} }] }
      guami: [{ plmn_id: { mcc: {{ .Values.plmn.mcc | quote }}, mnc: {{ .Values.plmn.mnc | quote }} }, amf_id: { region: 2, set: 1 } }]
      tai: [{ plmn_id: { mcc: {{ .Values.plmn.mcc | quote }}, mnc: {{ .Values.plmn.mnc | quote }} }, tac: {{ .Values.plmn.tac }} }]
      plmn_support: [{ plmn_id: { mcc: {{ .Values.plmn.mcc | quote }}, mnc: {{ .Values.plmn.mnc | quote }} }, s_nssai: [{ sst: {{ .Values.subscriber.sst }} }] }]
      security: { integrity_order: [NIA2, NIA1, NIA0], ciphering_order: [NEA0, NEA1, NEA2] }
      network_name: { full: Open5GS NTN {{ .Values.oai.scenario | upper }} }
      amf_name: open5gs-amf0
      time: { t3512: { value: 540 } }
  smf.yaml: |
    logger: { level: info }
    smf:
      sbi: { server: [{ dev: eth0, port: 7777 }], client: { nrf: [{ uri: http://{{ include "ntn.fullname" . }}-nrf:7777 }] } }
      pfcp: { server: [{ address: {{ .Values.addresses.smfN4 }} }], client: { upf: [{ address: {{ .Values.addresses.upfN4 }} }] } }
      gtpc: { server: [{ address: 0.0.0.0 }] }
      gtpu: { server: [{ address: {{ .Values.addresses.smfN4 }} }] }
      session: [{ subnet: {{ .Values.ueSubnet }}, gateway: {{ .Values.ueGateway }}, dnn: {{ .Values.subscriber.dnn }} }]
      dns: [8.8.8.8, 8.8.4.4]
      mtu: 1400
  upf.yaml: |
    logger: { level: info }
    upf:
      pfcp: { server: [{ address: {{ .Values.addresses.upfN4 }} }], client: { smf: [{ address: {{ .Values.addresses.smfN4 }} }] } }
      gtpu: { server: [{ address: {{ .Values.addresses.upfN3 }}, advertise: {{ .Values.addresses.upfN3 }} }] }
      session: [{ subnet: {{ .Values.ueSubnet }}, gateway: {{ .Values.ueGateway }}, dnn: {{ .Values.subscriber.dnn }}, dev: ogstun }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ntn.fullname" . }}-oai
data:
  gnb.conf: |
{{ tpl (.Files.Get "files/gnb.conf") . | indent 4 }}
  ue.conf: |
{{ tpl (.Files.Get "files/ue.conf") . | indent 4 }}
