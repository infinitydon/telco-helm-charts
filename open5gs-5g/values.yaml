image:
  open5gs: gradiant/open5gs:2.7.5
  webui: gradiant/open5gs-webui:2.7.5
  mongodb: mongo:6.0
  dbctl: gradiant/open5gs-dbctl:0.10.3
  ueransim: gradiant/ueransim:3.2.6
  toolbox: alpine:3.21
  pullPolicy: IfNotPresent

nodeSelector:
  kubernetes.io/hostname: ebpf-bng-node-01

plmn:
  mcc: "001"
  mnc: "01"
  tac: 1

subscriber:
  imsi: "001010000000001"
  key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
  opc: "E8ED289DEBA952E4283B54E88E6183CA"
  amf: "8000"
  dnn: internet
  sst: 1
  sd: "0x111111"

ueSubnet: 10.45.0.0/16
ueGateway: 10.45.0.1

# Each entry creates one Linux bridge NAD. Static workload addresses are
# assigned in the pod annotations so the packet path is easy to follow.
multus:
  n2:
    subnet: 10.51.0.0/24
  n3:
    subnet: 10.52.0.0/24
  n4:
    subnet: 10.53.0.0/24
  n6:
    subnet: 10.54.0.0/24

addresses:
  amfN2: 10.51.0.2
  gnbN2: 10.51.0.10
  upfN3: 10.52.0.2
  gnbN3: 10.52.0.10
  smfN4: 10.53.0.2
  upfN4: 10.53.0.3
  upfN6: 10.54.0.2
  dataN6: 10.54.0.100

resources: {}

webui:
  enabled: true
  service:
    type: NodePort
    port: 9999
    nodePort: 30081
