image:
  open5gs: gradiant/open5gs:2.7.5
  webui: gradiant/open5gs-webui:2.7.5
  mongodb: mongo:6.0
  dbctl: gradiant/open5gs-dbctl:0.10.3
  ueransim: gradiant/ueransim:3.2.6
  toolbox: alpine:3.21
  pullPolicy: IfNotPresent

nodeSelector:
  kubernetes.io/hostname: ebpf-bng-node-01

plmn:
  mcc: "001"
  mnc: "01"
  tac: 1

gnb:
  nci: "0x000000010"

subscriber:
  imsi: "001010000000001"
  key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
  opc: "E8ED289DEBA952E4283B54E88E6183CA"
  amf: "8000"
  dnn: internet
  sst: 1
  sd: "0x111111"

ueSubnet: 10.45.0.0/16
ueGateway: 10.45.0.1

multusDefaults:
  type: macvlan
  master: enp8s19
  mode: bridge
  ipam:
    type: static

# Each entry creates one Multus NAD. Static workload addresses are assigned
# in the pod annotations so the packet path is easy to follow.
multus:
  n2:
    subnet: 10.51.0.0/24
  n3:
    subnet: 10.52.0.0/24
  n4:
    subnet: 10.53.0.0/24
  n6:
    subnet: 10.54.0.0/24

addresses:
  amfN2: 10.51.0.2
  gnbN2: 10.51.0.10
  upfN3: 10.52.0.2
  gnbN3: 10.52.0.10
  smfN4: 10.53.0.2
  upfN4: 10.53.0.3
  upfN6: 10.54.0.2
  dataN6: 10.54.0.100
  iperfN6: 10.54.0.101

resources: {}

webui:
  enabled: true
  service:
    type: NodePort
    port: 9999
    nodePort: 30081

phoneUi:
  enabled: true
  proxyImage: ghcr.io/infinitydon/ueransim-phone:v0.2.1
  browserImage: lscr.io/linuxserver/chromium:bf9e0b4f-ls46
  tunnelPattern: "uesimtun*"
  homeUrl: https://example.com
  mobileUserAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 8 Build/AP2A.240705.005) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Mobile Safari/537.36"
  display:
    width: 430
    height: 930
  service:
    type: NodePort
    port: 443
    nodePort: 30082
  resources:
    proxy:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    browser:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

wasmRunner:
  enabled: true
  image: ghcr.io/infinitydon/ueransim-wasm-runner:v0.4.0
  listenHost: 0.0.0.0
  listenPort: 8090
  defaultTarget: https://www.cloudflare.com/cdn-cgi/trace
  service:
    type: NodePort
    port: 8090
    nodePort: 30083
  # Optional ConfigMap containing one or more files named *.wasm.
  existingScenarioConfigMap: ""
  requestTimeoutSeconds: 20
  fuel: 1000000
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 250m
      memory: 192Mi

iperf3Server:
  enabled: true
  image: alpine:3.21
  port: 5201

imagePullSecrets: []
