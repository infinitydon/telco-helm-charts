apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-gnb
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gnb
  ports:
    - name: radio
      port: 4997
      targetPort: 4997
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-gnb
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gnb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gnb
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configs.yaml") . | sha256sum }}
        checksum/nads: {{ include (print $.Template.BasePath "/nads.yaml") . | sha256sum }}
        checksum/traffic-profile: {{ toJson .Values.ueransim.trafficShaping | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "open5gs-5g.fullname" . }}-rls","interface":"rls0","ips":["{{ .Values.addresses.gnbRls }}/24"]},{"name":"{{ include "open5gs-5g.fullname" . }}-n2","interface":"n2","ips":["{{ .Values.addresses.gnbN2 }}/24"]},{"name":"{{ include "open5gs-5g.fullname" . }}-n3","interface":"n3","ips":["{{ .Values.addresses.gnbN3 }}/24"]}]
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      initContainers:
        - name: wait-for-amf
          image: {{ .Values.image.toolbox }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until ping -c 1 -W 1 {{ .Values.addresses.amfN2 }} >/dev/null 2>&1;
              do sleep 2; done
      containers:
        - name: gnb
          image: {{ .Values.image.ueransim }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gnb"]
          volumeMounts:
            - name: config
              mountPath: /etc/ueransim/gnb.yaml
              subPath: gnb.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "open5gs-5g.fullname" . }}-configs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-ue
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ue
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ue
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configs.yaml") . | sha256sum }}
        checksum/nads: {{ include (print $.Template.BasePath "/nads.yaml") . | sha256sum }}
        checksum/traffic-profile: {{ toJson .Values.ueransim.trafficShaping | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "open5gs-5g.fullname" . }}-rls","interface":"rls0","ips":["{{ .Values.addresses.ueRls }}/24"]}]
        {{- if .Values.phoneUi.enabled }}
        checksum/phone-ui: {{ include (print $.Template.BasePath "/phone-ui-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      initContainers:
        - name: provision-subscriber
          image: {{ .Values.image.dbctl }}
          env:
            - name: DB_URI
              value: mongodb://{{ include "open5gs-5g.fullname" . }}-mongodb/open5gs
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until open5gs-dbctl showall >/dev/null 2>&1; do sleep 2; done;
              open5gs-dbctl remove {{ .Values.subscriber.imsi }} || true;
              open5gs-dbctl add_ue_with_slice
              {{ .Values.subscriber.imsi }}
              {{ .Values.subscriber.key }}
              {{ .Values.subscriber.opc }}
              {{ .Values.subscriber.dnn }}
              {{ .Values.subscriber.sst }}
              {{ trimPrefix "0x" .Values.subscriber.sd }}
        - name: wait-for-gnb
          image: {{ .Values.image.toolbox }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until nc -zu -w 1 {{ .Values.addresses.gnbRls }} 4997
              >/dev/null 2>&1; do sleep 2; done
        {{- if .Values.redroid.enabled }}
        - name: prepare-redroid-ue-config
          image: {{ .Values.image.toolbox }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until GNB_IP="$(getent hosts {{ include "open5gs-5g.fullname" . }}-gnb |
              awk 'NR==1 {print $1}')" && [ -n "$GNB_IP" ]; do sleep 1; done;
              sed "s/{{ include "open5gs-5g.fullname" . }}-gnb/$GNB_IP/"
              /source/ue.yaml >/runtime/ue.yaml
          volumeMounts:
            - name: config
              mountPath: /source
              readOnly: true
            - name: redroid-ue-config
              mountPath: /runtime
        {{- end }}
        {{- if .Values.phoneUi.enabled }}
        - name: prepare-phone-ui
          image: {{ .Values.phoneUi.browserImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              cp -a /usr/share/selkies/selkies-dashboard/. /phone-dashboard/;
              cp /phone-config/index.html /phone-dashboard/index.html;
              cp /phone-config/phone.css /phone-dashboard/phone.css
          volumeMounts:
            - name: phone-dashboard
              mountPath: /phone-dashboard
            - name: phone-ui
              mountPath: /phone-config
              readOnly: true
        {{- end }}
      containers:
        - name: ue
          image: {{ .Values.image.ueransim }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.redroid.enabled }}
          command: ["/usr/bin/bash", "-ec"]
          args:
            - >-
              until timeout 1 bash -c '</dev/tcp/127.0.0.1/5555'
              >/dev/null 2>&1; do sleep 1; done;
              sleep 10;
              ip rule del priority 9000 2>/dev/null || true;
              ip rule add priority 9000 to {{ .Values.multus.rls.subnet }} lookup main;
              exec nr-ue -c /etc/ueransim/ue.yaml
          {{- else }}
          args: ["ue"]
          {{- end }}
          securityContext:
            privileged: true
            capabilities: { add: [NET_ADMIN] }
          volumeMounts:
            {{- if .Values.redroid.enabled }}
            - name: redroid-ue-config
              mountPath: /etc/ueransim/ue.yaml
              subPath: ue.yaml
            {{- else }}
            - name: config
              mountPath: /etc/ueransim/ue.yaml
              subPath: ue.yaml
            {{- end }}
        {{- if .Values.redroid.enabled }}
        - name: redroid-ue-proxy
          image: {{ .Values.redroid.proxyImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LISTEN_ADDRESS
              value: 0.0.0.0:8118
            - name: UE_INTERFACE_PATTERN
              value: uesimtun*
            - name: DNS_SERVER
              value: {{ .Values.redroid.dnsServer | quote }}
          ports:
            - name: redroid-proxy
              containerPort: 8118
          readinessProbe:
            httpGet:
              path: /healthz
              port: redroid-proxy
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redroid.resources.helper | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: [ALL]
              add: [NET_RAW]
        {{- if .Values.ueransim.trafficShaping.enabled }}
        - name: ue-traffic-shaper
          image: {{ .Values.image.ueransim }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until interface="$(ip -o link show | awk -F': ' '$2 ~ /^uesimtun/ {print $2; exit}')" && [ -n "$interface" ]; do sleep 1; done
              tc qdisc replace dev "$interface" root tbf rate {{ .Values.ueransim.trafficShaping.rate }} burst {{ .Values.ueransim.trafficShaping.burst }} latency {{ .Values.ueransim.trafficShaping.latency }}
              echo "UE uplink limited on $interface to {{ .Values.ueransim.trafficShaping.rate }}"
              exec sleep infinity
          resources:
            {{- toYaml .Values.redroid.resources.helper | nindent 12 }}
        {{- end }}
        {{- if .Values.redroid.show5gIndicator }}
        - name: redroid-5g-indicator
          image: {{ .Values.redroid.helperImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              apk add --no-cache android-tools;
              until adb connect 127.0.0.1:5555 >/dev/null 2>&1; do sleep 1; done;
              until [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed
              2>/dev/null | tr -d '\r')" = "1" ]; do sleep 1; done;
              sleep 5;
              adb -s 127.0.0.1:5555 shell settings put global sysui_demo_allowed 1;
              adb -s 127.0.0.1:5555 shell am broadcast
              -a com.android.systemui.demo -e command enter;
              adb -s 127.0.0.1:5555 shell am broadcast
              -a com.android.systemui.demo -e command network -e mobile show
              -e datatype 5g -e level 4 -e fully true -e sims 1 -e nosim false;
              exec sleep infinity
          resources:
            {{- toYaml .Values.redroid.resources.helper | nindent 12 }}
        {{- end }}
        - name: redroid
          image: {{ .Values.redroid.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - androidboot.redroid_width={{ .Values.redroid.display.width }}
            - androidboot.redroid_height={{ .Values.redroid.display.height }}
            - androidboot.redroid_dpi={{ .Values.redroid.display.dpi }}
            - androidboot.redroid_fps={{ .Values.redroid.display.fps }}
            - androidboot.use_memfd=true
            - androidboot.redroid_net_proxy_type=static
            - androidboot.redroid_net_proxy_host=127.0.0.1
            - androidboot.redroid_net_proxy_port=8118
            - ro.product.brand={{ .Values.redroid.device.brand }}
            - ro.product.manufacturer={{ .Values.redroid.device.manufacturer }}
            - ro.product.model={{ .Values.redroid.device.model }}
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          ports:
            - name: redroid-adb
              containerPort: 5555
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /system/bin/sh
                - -c
                - '[ "$(getprop sys.boot_completed)" = "1" ]'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            {{- toYaml .Values.redroid.resources.android | nindent 12 }}
          volumeMounts:
            - name: redroid-data
              mountPath: /data
        {{- end }}
        {{- if .Values.phoneUi.enabled }}
        - name: phone-proxy
          image: {{ .Values.phoneUi.proxyImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: UE_TUN_PATTERN
              value: {{ .Values.phoneUi.tunnelPattern | quote }}
          resources:
            {{- toYaml .Values.phoneUi.resources.proxy | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [SETGID, SETUID]
        - name: phone
          image: {{ .Values.phoneUi.browserImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TITLE
              value: UERANSIM Phone
            - name: DASHBOARD
              value: phone-dashboard
            - name: CHROME_CLI
              value: ""
            - name: SELKIES_MANUAL_WIDTH
              value: {{ .Values.phoneUi.display.width | quote }}
            - name: SELKIES_MANUAL_HEIGHT
              value: {{ .Values.phoneUi.display.height | quote }}
            - name: SELKIES_SCALING_DPI
              value: "96"
            - name: SELKIES_USE_CSS_SCALING
              value: "true|locked"
            - name: MAX_RES
              value: {{ printf "%vx%v" .Values.phoneUi.display.width .Values.phoneUi.display.height | quote }}
            - name: HARDEN_DESKTOP
              value: "true"
            - name: HARDEN_OPENBOX
              value: "true"
            - name: DISABLE_IPV6
              value: "true"
            - name: SELKIES_UI_TITLE
              value: UERANSIM Phone
            - name: SELKIES_UI_SHOW_LOGO
              value: "false|locked"
            - name: SELKIES_UI_SHOW_SIDEBAR
              value: "false|locked"
            - name: SELKIES_UI_SIDEBAR_SHOW_FILES
              value: "false|locked"
            - name: SELKIES_UI_SIDEBAR_SHOW_APPS
              value: "false|locked"
          ports:
            - name: phone-http
              containerPort: 3000
              protocol: TCP
            - name: phone-https
              containerPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: phone-https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.phoneUi.resources.browser | nindent 12 }}
          volumeMounts:
            - name: phone-dashboard
              mountPath: /usr/share/selkies/phone-dashboard
              readOnly: true
            - name: phone-ui
              mountPath: /custom-cont-init.d/99-ueransim-phone-browser
              subPath: browser-init.sh
              readOnly: true
        {{- end }}
        {{- if .Values.wasmRunner.enabled }}
        - name: wasm-runner
          image: {{ .Values.wasmRunner.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LISTEN_HOST
              value: {{ .Values.wasmRunner.listenHost | quote }}
            - name: LISTEN_PORT
              value: {{ .Values.wasmRunner.listenPort | quote }}
            - name: UE_INTERFACE_PATTERN
              value: {{ .Values.phoneUi.tunnelPattern | quote }}
            - name: UE_CONFIG_PATH
              value: "/etc/ueransim/ue.yaml"
            - name: SOCKS_PROXY
              value: "socks5h://127.0.0.1:1080"
            - name: DEFAULT_TARGET
              value: {{ .Values.wasmRunner.defaultTarget | quote }}
            - name: PING_TARGET
              value: {{ .Values.addresses.dataN6 | quote }}
            - name: IPERF3_TARGET
              value: {{ printf "%s:%v" .Values.addresses.iperfN6 .Values.iperf3Server.port | quote }}
            - name: REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.wasmRunner.requestTimeoutSeconds | quote }}
            - name: WASM_FUEL
              value: {{ .Values.wasmRunner.fuel | int | quote }}
          ports:
            - name: wasm-http
              containerPort: {{ .Values.wasmRunner.listenPort }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen("http://127.0.0.1:{{ .Values.wasmRunner.listenPort }}/healthz", timeout=2)
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_RAW]
          resources:
            {{- toYaml .Values.wasmRunner.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/ueransim/ue.yaml
              subPath: ue.yaml
              readOnly: true
            - name: wasm-tmp
              mountPath: /tmp
          {{- if .Values.wasmRunner.existingScenarioConfigMap }}
            - name: wasm-scenarios
              mountPath: /scenarios
              readOnly: true
          {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "open5gs-5g.fullname" . }}-configs
        {{- if .Values.phoneUi.enabled }}
        - name: phone-ui
          configMap:
            name: {{ include "open5gs-5g.fullname" . }}-phone-ui
            defaultMode: 0755
        - name: phone-dashboard
          emptyDir: {}
        {{- end }}
        {{- if and .Values.wasmRunner.enabled .Values.wasmRunner.existingScenarioConfigMap }}
        - name: wasm-scenarios
          configMap:
            name: {{ .Values.wasmRunner.existingScenarioConfigMap }}
        {{- end }}
        {{- if .Values.wasmRunner.enabled }}
        - name: wasm-tmp
          emptyDir: {}
        {{- end }}
        {{- if .Values.redroid.enabled }}
        - name: redroid-data
          emptyDir: {}
        - name: redroid-ue-config
          emptyDir: {}
        {{- end }}
{{- if .Values.phoneUi.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-phone
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    app.kubernetes.io/component: phone
spec:
  type: {{ .Values.phoneUi.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ue
  ports:
    - name: http
      port: {{ .Values.phoneUi.service.port }}
      targetPort: phone-https
      protocol: TCP
      {{- if and (eq .Values.phoneUi.service.type "NodePort") .Values.phoneUi.service.nodePort }}
      nodePort: {{ .Values.phoneUi.service.nodePort }}
      {{- end }}
{{- end }}
{{- if .Values.librespeed.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-librespeed
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: librespeed
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: librespeed
      annotations:
        checksum/nads: {{ include (print $.Template.BasePath "/nads.yaml") . | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "open5gs-5g.fullname" . }}-n6","interface":"n6","ips":["{{ .Values.addresses.librespeedN6 }}/24"]}]
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      initContainers:
        - name: configure-n6-route
          image: {{ .Values.image.toolbox }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              ip route replace {{ .Values.ueSubnet }} via {{ .Values.addresses.upfN6 }} dev n6 onlink;
              {{- if .Values.ueransim.trafficShaping.enabled }}
              apk add --no-cache iproute2-tc;
              tc qdisc replace dev n6 root tbf rate {{ .Values.ueransim.trafficShaping.rate }} burst {{ .Values.ueransim.trafficShaping.burst }} latency {{ .Values.ueransim.trafficShaping.latency }}
              {{- end }}
      containers:
        - name: librespeed
          image: {{ .Values.librespeed.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MODE
              value: standalone
            - name: TITLE
              value: {{ .Values.librespeed.title | quote }}
            - name: TELEMETRY
              value: "false"
            - name: REDACT_IP_ADDRESSES
              value: "true"
            - name: DISABLE_IPINFO
              value: "true"
            - name: USE_NEW_DESIGN
              value: "true"
            - name: WEBPORT
              value: {{ .Values.librespeed.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.librespeed.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.librespeed.resources | nindent 12 }}
          volumeMounts:
            - name: librespeed-settings
              mountPath: /speedtest/frontend/settings.json
              subPath: settings.json
              readOnly: true
      volumes:
        - name: librespeed-settings
          configMap:
            name: {{ include "open5gs-5g.fullname" . }}-librespeed-settings
{{- if .Values.librespeed.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-librespeed
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  type: {{ .Values.librespeed.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: librespeed
  ports:
    - name: http
      port: {{ .Values.librespeed.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
{{- if .Values.redroid.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-redroid-adb
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    app.kubernetes.io/component: redroid
spec:
  type: {{ .Values.redroid.service.type }}
  selector:
