      targetPort: redroid-adb
      protocol: TCP
      {{- if and (eq .Values.redroid.service.type "NodePort") .Values.redroid.service.nodePort }}
      nodePort: {{ .Values.redroid.service.nodePort }}
      {{- end }}
{{- end }}
{{- if .Values.wasmRunner.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-wasm
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    app.kubernetes.io/component: wasm-runner
spec:
  type: {{ .Values.wasmRunner.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ue
  ports:
    - name: http
      port: {{ .Values.wasmRunner.service.port }}
      targetPort: wasm-http
      protocol: TCP
      {{- if and (eq .Values.wasmRunner.service.type "NodePort") .Values.wasmRunner.service.nodePort }}
      nodePort: {{ .Values.wasmRunner.service.nodePort }}
      {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-data
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: data
      annotations:
        checksum/nads: {{ include (print $.Template.BasePath "/nads.yaml") . | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "open5gs-5g.fullname" . }}-n6","interface":"n6","ips":["{{ .Values.addresses.dataN6 }}/24"]}]
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: data
          image: {{ .Values.image.toolbox }}
          securityContext:
            privileged: true
            capabilities: { add: [NET_ADMIN] }
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              apk add --no-cache iptables;
              sysctl -w net.ipv4.ip_forward=1;
              sysctl -w net.ipv4.conf.all.rp_filter=0;
              ip route add {{ .Values.ueSubnet }} via {{ .Values.addresses.upfN6 }} dev n6;
              iptables -t nat -A POSTROUTING -s {{ .Values.ueSubnet }} -o eth0 -j MASQUERADE;
              sleep infinity
{{- if .Values.iperf3Server.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-iperf3
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: iperf3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: iperf3
      annotations:
        checksum/nads: {{ include (print $.Template.BasePath "/nads.yaml") . | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "open5gs-5g.fullname" . }}-n6","interface":"n6","ips":["{{ .Values.addresses.iperfN6 }}/24"]}]
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: iperf3-server
          image: {{ .Values.iperf3Server.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              apk add --no-cache iperf3;
              ip route add {{ .Values.ueSubnet }} via {{ .Values.addresses.upfN6 }} dev n6 onlink;
              exec iperf3 -s -p {{ .Values.iperf3Server.port }}
          ports:
            - name: iperf3
              containerPort: {{ .Values.iperf3Server.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: iperf3
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
{{- end }}
