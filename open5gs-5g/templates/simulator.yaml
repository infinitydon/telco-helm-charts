apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-gnb
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gnb
  ports:
    - name: radio
      port: 4997
      targetPort: 4997
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-gnb
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gnb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gnb
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configs.yaml") . | sha256sum }}
        checksum/nads: {{ include (print $.Template.BasePath "/nads.yaml") . | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "open5gs-5g.fullname" . }}-n2","interface":"n2","ips":["{{ .Values.addresses.gnbN2 }}/24"]},{"name":"{{ include "open5gs-5g.fullname" . }}-n3","interface":"n3","ips":["{{ .Values.addresses.gnbN3 }}/24"]}]
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      initContainers:
        - name: wait-for-amf
          image: {{ .Values.image.toolbox }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until ping -c 1 -W 1 {{ .Values.addresses.amfN2 }} >/dev/null 2>&1;
              do sleep 2; done
      containers:
        - name: gnb
          image: {{ .Values.image.ueransim }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gnb"]
          volumeMounts:
            - name: config
              mountPath: /etc/ueransim/gnb.yaml
              subPath: gnb.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "open5gs-5g.fullname" . }}-configs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-ue
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ue
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ue
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configs.yaml") . | sha256sum }}
        {{- if .Values.phoneUi.enabled }}
        checksum/phone-ui: {{ include (print $.Template.BasePath "/phone-ui-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      initContainers:
        - name: provision-subscriber
          image: {{ .Values.image.dbctl }}
          env:
            - name: DB_URI
              value: mongodb://{{ include "open5gs-5g.fullname" . }}-mongodb/open5gs
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until open5gs-dbctl showall >/dev/null 2>&1; do sleep 2; done;
              open5gs-dbctl remove {{ .Values.subscriber.imsi }} || true;
              open5gs-dbctl add_ue_with_slice
              {{ .Values.subscriber.imsi }}
              {{ .Values.subscriber.key }}
              {{ .Values.subscriber.opc }}
              {{ .Values.subscriber.dnn }}
              {{ .Values.subscriber.sst }}
              {{ trimPrefix "0x" .Values.subscriber.sd }}
        - name: wait-for-gnb
          image: {{ .Values.image.toolbox }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until nc -zu -w 1 {{ include "open5gs-5g.fullname" . }}-gnb 4997
              >/dev/null 2>&1; do sleep 2; done
        {{- if .Values.phoneUi.enabled }}
        - name: prepare-phone-ui
          image: {{ .Values.phoneUi.browserImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              cp -a /usr/share/selkies/selkies-dashboard/. /phone-dashboard/;
              cp /phone-config/index.html /phone-dashboard/index.html;
              cp /phone-config/phone.css /phone-dashboard/phone.css
          volumeMounts:
            - name: phone-dashboard
              mountPath: /phone-dashboard
            - name: phone-ui
              mountPath: /phone-config
              readOnly: true
        {{- end }}
      containers:
        - name: ue
          image: {{ .Values.image.ueransim }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["ue"]
          securityContext:
            privileged: true
            capabilities: { add: [NET_ADMIN] }
          volumeMounts:
            - name: config
              mountPath: /etc/ueransim/ue.yaml
              subPath: ue.yaml
        {{- if .Values.phoneUi.enabled }}
        - name: phone-proxy
          image: {{ .Values.phoneUi.proxyImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: UE_TUN_PATTERN
              value: {{ .Values.phoneUi.tunnelPattern | quote }}
          resources:
            {{- toYaml .Values.phoneUi.resources.proxy | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [SETGID, SETUID]
        - name: phone
          image: {{ .Values.phoneUi.browserImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TITLE
              value: UERANSIM Phone
            - name: DASHBOARD
              value: phone-dashboard
            - name: CHROME_CLI
              value: {{ printf "--start-maximized --force-device-scale-factor=1 --proxy-server=socks5://127.0.0.1:1080 %s" .Values.phoneUi.homeUrl | quote }}
            - name: SELKIES_MANUAL_WIDTH
              value: {{ .Values.phoneUi.display.width | quote }}
            - name: SELKIES_MANUAL_HEIGHT
              value: {{ .Values.phoneUi.display.height | quote }}
            - name: SELKIES_SCALING_DPI
              value: "96"
            - name: SELKIES_USE_CSS_SCALING
              value: "true|locked"
            - name: MAX_RES
              value: {{ printf "%vx%v" .Values.phoneUi.display.width .Values.phoneUi.display.height | quote }}
            - name: HARDEN_DESKTOP
              value: "true"
            - name: HARDEN_OPENBOX
              value: "true"
            - name: DISABLE_IPV6
              value: "true"
            - name: SELKIES_UI_TITLE
              value: UERANSIM Phone
            - name: SELKIES_UI_SHOW_LOGO
              value: "false|locked"
            - name: SELKIES_UI_SHOW_SIDEBAR
              value: "false|locked"
            - name: SELKIES_UI_SIDEBAR_SHOW_FILES
              value: "false|locked"
            - name: SELKIES_UI_SIDEBAR_SHOW_APPS
              value: "false|locked"
          ports:
            - name: phone-http
              containerPort: 3000
              protocol: TCP
            - name: phone-https
              containerPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: phone-https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.phoneUi.resources.browser | nindent 12 }}
          volumeMounts:
            - name: phone-dashboard
              mountPath: /usr/share/selkies/phone-dashboard
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "open5gs-5g.fullname" . }}-configs
        {{- if .Values.phoneUi.enabled }}
        - name: phone-ui
          configMap:
            name: {{ include "open5gs-5g.fullname" . }}-phone-ui
        - name: phone-dashboard
          emptyDir: {}
        {{- end }}
{{- if .Values.phoneUi.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-phone
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    app.kubernetes.io/component: phone
spec:
  type: {{ .Values.phoneUi.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ue
  ports:
    - name: http
      port: {{ .Values.phoneUi.service.port }}
      targetPort: phone-https
      protocol: TCP
      {{- if and (eq .Values.phoneUi.service.type "NodePort") .Values.phoneUi.service.nodePort }}
      nodePort: {{ .Values.phoneUi.service.nodePort }}
      {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-data
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: data
      annotations:
        checksum/nads: {{ include (print $.Template.BasePath "/nads.yaml") . | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":"{{ include "open5gs-5g.fullname" . }}-n6","interface":"n6","ips":["{{ .Values.addresses.dataN6 }}/24"]}]
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: data
          image: {{ .Values.image.toolbox }}
          securityContext:
            privileged: true
            capabilities: { add: [NET_ADMIN] }
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              apk add --no-cache iptables;
              sysctl -w net.ipv4.ip_forward=1;
              sysctl -w net.ipv4.conf.all.rp_filter=0;
              ip route add {{ .Values.ueSubnet }} via {{ .Values.addresses.upfN6 }} dev n6;
              iptables -t nat -A POSTROUTING -s {{ .Values.ueSubnet }} -o eth0 -j MASQUERADE;
              sleep infinity
