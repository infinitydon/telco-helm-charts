{{- if and .Values.redroid.enabled .Values.redroid.binder.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-redroid-binder-modules
  namespace: {{ .Values.redroid.binder.namespace }}
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    app.kubernetes.io/component: redroid-binder-modules
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redroid-binder-modules
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redroid-binder-modules
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      nodeSelector:
        {{- toYaml .Values.redroid.binder.nodeSelector | nindent 8 }}
      initContainers:
        - name: install-and-load-binder
          image: {{ .Values.redroid.binder.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          command: ["/bin/bash", "-euc"]
          args:
            - |
              kernel="$(uname -r)"
              installed=false
              if ! chroot /host modinfo binder_linux >/dev/null 2>&1; then
                chroot /host apt-get update
                chroot /host env DEBIAN_FRONTEND=noninteractive \
                  apt-get install --yes --no-install-recommends \
                  "linux-modules-extra-${kernel}"
                installed=true
              fi
              if [ "$installed" = true ]; then
                while ! mkdir /host/run/lock/open5gs-kmod.lock 2>/dev/null; do sleep 1; done
                trap 'rmdir /host/run/lock/open5gs-kmod.lock' EXIT
                chroot /host depmod -a "${kernel}"
                rmdir /host/run/lock/open5gs-kmod.lock
                trap - EXIT
              fi
              install -d /host/etc/modules-load.d /host/etc/modprobe.d
              printf '%s\n' binder_linux > /host/etc/modules-load.d/redroid.conf
              printf '%s\n' \
                'options binder_linux devices=binder,hwbinder,vndbinder' \
                > /host/etc/modprobe.d/redroid-binder.conf
              chroot /host modprobe binder_linux devices=binder,hwbinder,vndbinder
              grep -q binder /host/proc/filesystems
              test -d /host/sys/module/binder_linux
          volumeMounts:
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
      containers:
        - name: verifier
          image: {{ .Values.redroid.binder.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-euc"]
          args: ["trap : TERM INT; while sleep 3600; do :; done"]
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -euc
                - >-
                  grep -q binder /host/proc/filesystems &&
                  test -d /host/sys/module/binder_linux
            initialDelaySeconds: 2
            periodSeconds: 30
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
{{- end }}
