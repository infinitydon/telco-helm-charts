{{- if .Values.phoneUi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-phone-ui
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="theme-color" content="#07111f">
        <title>UERANSIM Phone</title>
        <link rel="apple-touch-icon" href="icon.png">
        <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
        <link rel="icon" type="image/png" href="icon.png">
        <script type="module" crossorigin src="./assets/index-CAeqcoUL.js"></script>
        <link rel="stylesheet" crossorigin href="./assets/index-BfqkCnaC.css">
        <link rel="stylesheet" href="./phone.css">
      </head>
      <body>
        <main class="phone-lab">
          <header class="lab-header">
            <div>
              <span class="eyebrow">UERANSIM</span>
              <h1>UE Phone</h1>
            </div>
            <div class="network-state" aria-label="UE network connected">
              <span class="signal-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <span>5G SA</span>
              <span class="online-dot"></span>
            </div>
          </header>
          <section class="device" aria-label="Interactive UE browser">
            <div class="device-speaker" aria-hidden="true"></div>
            <div id="app"></div>
            <div class="home-indicator" aria-hidden="true"></div>
          </section>
          <footer class="lab-footer">
            <span class="online-dot"></span>
            Browser traffic routed through <strong>uesimtun0</strong>
          </footer>
        </main>
        <div id="root"></div>
        <div id="touch-gamepad-host"></div>
        <script src="src/universalTouchGamepad.js"></script>
      </body>
    </html>
  phone.css: |
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0 !important;
      overflow: hidden !important;
      background:
        radial-gradient(circle at 50% 16%, rgba(34, 211, 238, .13), transparent 32rem),
        linear-gradient(145deg, #050914 0%, #091626 50%, #050913 100%) !important;
    }
    body {
      color: #e8f3ff !important;
    }
    .phone-lab {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      justify-items: center;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
      padding: 14px 20px 16px;
    }
    .lab-header {
      width: min(560px, 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .eyebrow {
      display: block;
      color: #67e8f9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
    }
    .lab-header h1 {
      margin: 2px 0 0;
      font-size: 20px;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .network-state {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid rgba(103, 232, 249, .24);
      border-radius: 999px;
      background: rgba(7, 17, 31, .72);
      color: #a5f3fc;
      font-size: 11px;
      font-weight: 750;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .22);
    }
    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, .85);
    }
    .signal-bars {
      height: 12px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
    }
    .signal-bars i {
      width: 2px;
      border-radius: 2px;
      background: #67e8f9;
    }
    .signal-bars i:nth-child(1) { height: 3px; }
    .signal-bars i:nth-child(2) { height: 6px; }
    .signal-bars i:nth-child(3) { height: 9px; }
    .signal-bars i:nth-child(4) { height: 12px; }
    .device {
      position: relative;
      width: min(390px, calc((100vh - 126px) * .462085), calc(100vw - 40px));
      aspect-ratio: 390 / 844;
      min-height: 0;
      overflow: hidden;
      border: 7px solid #111827;
      border-radius: clamp(24px, 4vh, 42px);
      background: #000;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .16),
        0 28px 70px rgba(0, 0, 0, .55),
        0 0 60px rgba(34, 211, 238, .08);
      box-sizing: border-box;
      isolation: isolate;
    }
    .device-speaker {
      position: absolute;
      top: 7px;
      left: 50%;
      z-index: 20;
      width: 44px;
      height: 4px;
      border-radius: 99px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, .84);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .1);
      pointer-events: none;
    }
    .home-indicator {
      position: absolute;
      bottom: 5px;
      left: 50%;
      z-index: 20;
      width: 72px;
      height: 4px;
      border-radius: 99px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, .72);
      pointer-events: none;
    }
    #app {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      display: flex !important;
      overflow: hidden !important;
      background: #fff !important;
    }
    .video-container {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      overflow: hidden !important;
      background: #fff !important;
    }
    .video-container #videoCanvas,
    .video-container #overlayInput {
      inset: 0 !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
    }
    .lab-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #8ca5bf;
      font-size: 11px;
      letter-spacing: .01em;
    }
    .lab-footer strong {
      color: #c8f7ff;
      font-weight: 750;
    }
    #root, #touch-gamepad-host {
      position: fixed !important;
      inset: 0 !important;
      pointer-events: none !important;
    }
    #root > *, #touch-gamepad-host > * {
      pointer-events: auto;
    }
    @media (max-height: 610px) {
      .phone-lab {
        grid-template-rows: minmax(0, 1fr);
        padding: 8px;
      }
      .lab-header, .lab-footer {
        display: none;
      }
      .device {
        width: min(390px, calc((100vh - 16px) * .462085), calc(100vw - 16px));
      }
    }
{{- end }}
