{{- if .Values.phoneUi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-phone-ui
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
data:
  browser-init.sh: |
    #!/bin/sh
    cat > /config/.config/labwc/autostart <<'PHONE_AUTOSTART'
    #!/bin/bash
    wrapped-chromium \
      --enable-features=UseOzonePlatform,OverlayScrollbar \
      --ozone-platform=wayland \
      --start-maximized \
      --no-first-run \
      --no-default-browser-check \
      --disable-session-crashed-bubble \
      --force-device-scale-factor=0.9 \
      --touch-events=enabled \
      --user-agent='{{ .Values.phoneUi.mobileUserAgent }}' \
      --proxy-server=socks5://127.0.0.1:1080 \
      '{{ .Values.phoneUi.homeUrl }}'
    PHONE_AUTOSTART
    chmod 0555 /config/.config/labwc/autostart
    sed -i '/location \/devmode {/i\
      location = /ue-status {\
        proxy_set_header Host $host;\
        proxy_set_header X-Forwarded-Proto $scheme;\
        proxy_connect_timeout 5s;\
        proxy_read_timeout 10s;\
        proxy_pass http://127.0.0.1:8090/api/ue-status;\
      }' /etc/nginx/sites-available/default
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="theme-color" content="#07111f">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <title>UERANSIM Phone</title>
        <link rel="apple-touch-icon" href="icon.png">
        <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
        <link rel="icon" type="image/png" href="icon.png">
        <script type="module" crossorigin src="./assets/index-CAeqcoUL.js"></script>
        <link rel="stylesheet" crossorigin href="./assets/index-BfqkCnaC.css">
        <link rel="stylesheet" href="./phone.css">
      </head>
      <body>
        <main class="phone-lab">
          <header class="lab-header">
            <div>
              <span class="eyebrow">UERANSIM</span>
              <h1>UE Phone</h1>
            </div>
            <div class="network-state" aria-label="UE network connected">
              <span class="signal-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <span>5G SA</span>
              <span class="online-dot"></span>
            </div>
          </header>
          <aside class="status-panel" aria-label="Live UE status">
            <div class="status-heading">
              <div>
                <span class="eyebrow">LIVE TELEMETRY</span>
                <h2>UE Status</h2>
              </div>
              <span class="status-live"><i></i> LIVE</span>
            </div>
            <section class="status-card">
              <h3>Connection</h3>
              <dl>
                <div><dt>Registration</dt><dd id="status-registration">Checking</dd></div>
                <div><dt>PDU session</dt><dd id="status-pdu">Checking</dd></div>
                <div><dt>Tunnel</dt><dd id="status-tunnel">—</dd></div>
                <div><dt>UE address</dt><dd id="status-ip">—</dd></div>
                <div><dt>Gateway</dt><dd id="status-gateway">—</dd></div>
                <div><dt>Downlink</dt><dd id="status-rx">—</dd></div>
                <div><dt>Uplink</dt><dd id="status-tx">—</dd></div>
              </dl>
            </section>
            <section class="status-card">
              <h3>Serving network</h3>
              <dl>
                <div><dt>gNB</dt><dd id="status-gnb">—</dd></div>
                <div><dt>gNB N2</dt><dd id="status-gnb-ip">—</dd></div>
                <div><dt>PLMN / TAC</dt><dd id="status-plmn">—</dd></div>
                <div><dt>NR Cell ID</dt><dd id="status-cell">—</dd></div>
                <div><dt>Slice</dt><dd id="status-slice">—</dd></div>
                <div><dt>DNN</dt><dd id="status-dnn">—</dd></div>
                <div><dt>IMSI</dt><dd id="status-imsi">—</dd></div>
              </dl>
            </section>
            <section class="status-card last-test">
              <h3>Last WASM test</h3>
              <p id="status-test">No test run yet</p>
            </section>
            <p class="status-updated" id="status-updated">Connecting to telemetry…</p>
          </aside>
          <section class="device" aria-label="Interactive UE browser">
            <div class="device-speaker" aria-hidden="true"></div>
            <div id="app"></div>
            <div class="home-indicator" aria-hidden="true"></div>
          </section>
          <footer class="lab-footer">
            <span class="online-dot"></span>
            Browser traffic routed through <strong>uesimtun0</strong>
          </footer>
        </main>
        <div id="root"></div>
        <div id="touch-gamepad-host"></div>
        <script src="src/universalTouchGamepad.js"></script>
        <script>
          const statusText = (id, value) => {
            const node = document.getElementById(id);
            if (node) node.textContent = value || "—";
          };
          const formatUptime = seconds => {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return hours ? `${hours}h ${minutes}m` : `${minutes}m`;
          };
          async function refreshUeStatus() {
            try {
              const response = await fetch("./ue-status", { cache: "no-store" });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const data = await response.json();
              statusText("status-registration", data.registration);
              statusText("status-pdu", data.pduSession);
              statusText("status-tunnel", data.tunnelInterface);
              statusText("status-ip", data.tunnelIp);
              statusText("status-gateway", data.ueGateway);
              statusText("status-rx", data.rxRate);
              statusText("status-tx", data.txRate);
              statusText("status-gnb", `${data.servingGnb} · ${data.gnbState}`);
              statusText("status-gnb-ip", data.gnbN2Address);
              statusText("status-plmn", `${data.plmn} / ${data.tac}`);
              statusText("status-cell", data.nrCellId);
              statusText("status-slice", data.slice);
              statusText("status-dnn", data.dnn);
              statusText("status-imsi", data.imsi);
              const test = data.testRunning
                ? "Test running…"
                : data.lastTest
                  ? `${data.lastTest.scenario}: ${data.lastTest.ok ? "PASS" : "FAIL"}`
                  : "No test run yet";
              statusText("status-test", test);
              statusText("status-updated", `Updated now · session ${formatUptime(data.uptimeSeconds)}`);
            } catch (error) {
              statusText("status-updated", `Telemetry unavailable · ${error.message}`);
            }
          }
          refreshUeStatus();
          setInterval(refreshUeStatus, 3000);
        </script>
      </body>
    </html>
  phone.css: |
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0 !important;
      overflow: hidden !important;
      background:
        radial-gradient(circle at 50% 16%, rgba(34, 211, 238, .13), transparent 32rem),
        linear-gradient(145deg, #050914 0%, #091626 50%, #050913 100%) !important;
    }
    body {
      color: #e8f3ff !important;
    }
    .phone-lab {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-columns: minmax(240px, 300px) minmax(0, 430px);
      justify-items: center;
      align-items: center;
      justify-content: center;
      column-gap: clamp(28px, 5vw, 76px);
      row-gap: 12px;
      box-sizing: border-box;
      padding: 14px 20px 16px;
    }
    .lab-header {
      grid-column: 1 / -1;
      width: min(806px, 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .status-panel {
      grid-column: 1;
      grid-row: 2;
      width: 100%;
      max-height: 100%;
      align-self: center;
      display: grid;
      gap: 10px;
      overflow: auto;
      scrollbar-width: thin;
      box-sizing: border-box;
    }
    .status-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }
    .status-heading h2 {
      margin: 2px 0 0;
      font-size: 20px;
    }
    .status-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #6ee7b7;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .status-live i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, .8);
    }
    .status-card {
      padding: 13px 14px;
      border: 1px solid rgba(103, 232, 249, .16);
      border-radius: 14px;
      background: rgba(9, 25, 41, .76);
      box-shadow: 0 16px 38px rgba(0, 0, 0, .18);
      backdrop-filter: blur(12px);
    }
    .status-card h3 {
      margin: 0 0 9px;
      color: #a5f3fc;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .status-card dl {
      display: grid;
      gap: 7px;
      margin: 0;
    }
    .status-card dl div {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr);
      gap: 10px;
      align-items: baseline;
    }
    .status-card dt {
      color: #7189a1;
      font-size: 10px;
    }
    .status-card dd {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #d9f7ff;
      font-size: 10px;
      font-weight: 700;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status-gnb {
      overflow-wrap: anywhere;
      text-overflow: clip;
      white-space: normal;
    }
    .last-test p, .status-updated {
      margin: 0;
      color: #9bb2c8;
      font-size: 10px;
      line-height: 1.45;
    }
    .status-updated {
      padding: 0 3px;
    }
    .eyebrow {
      display: block;
      color: #67e8f9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
    }
    .lab-header h1 {
      margin: 2px 0 0;
      font-size: 20px;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .network-state {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid rgba(103, 232, 249, .24);
      border-radius: 999px;
      background: rgba(7, 17, 31, .72);
      color: #a5f3fc;
      font-size: 11px;
      font-weight: 750;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .22);
    }
    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, .85);
    }
    .signal-bars {
      height: 12px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
    }
    .signal-bars i {
      width: 2px;
      border-radius: 2px;
      background: #67e8f9;
    }
    .signal-bars i:nth-child(1) { height: 3px; }
    .signal-bars i:nth-child(2) { height: 6px; }
    .signal-bars i:nth-child(3) { height: 9px; }
    .signal-bars i:nth-child(4) { height: 12px; }
    .device {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      width: min(430px, calc((100vh - 126px) * .462085), calc(100vw - 40px));
      aspect-ratio: 430 / 930;
      min-height: 0;
      overflow: hidden;
      border: 7px solid #111827;
      border-radius: clamp(24px, 4vh, 42px);
      background: #000;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .16),
        0 28px 70px rgba(0, 0, 0, .55),
        0 0 60px rgba(34, 211, 238, .08);
      box-sizing: border-box;
      isolation: isolate;
    }
    .device-speaker {
      position: absolute;
      top: 7px;
      left: 50%;
      z-index: 20;
      width: 44px;
      height: 4px;
      border-radius: 99px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, .84);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .1);
      pointer-events: none;
    }
    .home-indicator {
      position: absolute;
      bottom: 5px;
      left: 50%;
      z-index: 20;
      width: 72px;
      height: 4px;
      border-radius: 99px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, .72);
      pointer-events: none;
    }
    #app {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      display: flex !important;
      overflow: hidden !important;
      background: #fff !important;
    }
    .video-container {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      overflow: hidden !important;
      background: #fff !important;
    }
    .video-container #videoCanvas,
    .video-container #overlayInput {
      inset: 0 !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
      object-fit: contain !important;
    }
    .lab-footer {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #8ca5bf;
      font-size: 11px;
      letter-spacing: .01em;
    }
    .lab-footer strong {
      color: #c8f7ff;
      font-weight: 750;
    }
    #root, #touch-gamepad-host {
      position: fixed !important;
      inset: 0 !important;
      pointer-events: none !important;
    }
    #root > *, #touch-gamepad-host > * {
      pointer-events: auto;
    }
    @media (max-height: 610px) {
      .phone-lab {
        grid-template-rows: minmax(0, 1fr);
        padding: 8px;
      }
      .lab-header, .lab-footer {
        display: none;
      }
      .status-panel {
        display: none;
      }
      .device {
        width: min(430px, calc((100vh - 16px) * .462085), calc(100vw - 16px));
      }
    }
    @media (max-width: 820px) {
      .phone-lab {
        grid-template-columns: minmax(0, 430px);
      }
      .lab-header, .device, .lab-footer {
        grid-column: 1;
      }
      .status-panel {
        display: none;
      }
    }
{{- end }}
