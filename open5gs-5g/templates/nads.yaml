{{- range $name, $network := .Values.multus }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ include "open5gs-5g.fullname" $ }}-{{ $name }}
  labels:
    {{- include "open5gs-5g.labels" $ | nindent 4 }}
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "{{ include "open5gs-5g.fullname" $ }}-{{ $name }}",
      "type": "bridge",
      "bridge": "{{ include "open5gs-5g.fullname" $ | trunc 8 }}-{{ $name }}",
      "ipam": {
        "type": "static"
      }
    }
{{- end }}
