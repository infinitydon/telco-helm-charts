apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ella-ran
spec:
  config: '{"cniVersion":"0.3.1","type":"bridge","bridge":"ella-test-ran","ipam":{"type":"host-local","subnet":"10.204.0.0/24"}}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ella-core-lab
data:
  core.yaml: |
    logging:
      system: {level: info, output: stdout}
      audit: {output: stdout}
    db:
      path: /data/core.db
    interfaces:
      n2: {address: __POD_IP__}
      n3: {name: net1}
      n6: {name: net2}
      api: {address: 0.0.0.0, port: 5002}
      diameter: {address: __POD_IP__}
    datapath:
      attach-mode: tcx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ella-core-lab
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ella-core-lab}
  template:
    metadata:
      labels: {app: ella-core-lab}
      annotations:
        k8s.v1.cni.cncf.io/networks: ella-ran,ella-n6-core
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      shareProcessNamespace: {{ .Values.troubleshooting.shareProcessNamespace }}
      initContainers:
        - name: config
          image: busybox:1.37.0
          command: [sh, -ec]
          args: ['sed "s/__POD_IP__/${POD_IP}/g" /input/core.yaml > /config/core.yaml']
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          volumeMounts:
            - {name: input, mountPath: /input}
            - {name: config, mountPath: /config}
      containers:
        - name: core
          image: {{ .Values.image | quote }}
          command: [core, --config, /config/core.yaml]
          securityContext: {privileged: true}
          readinessProbe:
            httpGet: {path: /api/v1/status, port: 5002}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /data}
            - {name: bpf, mountPath: /sys/fs/bpf}
        {{- if .Values.troubleshooting.enabled }}
        # Network tools share the Core network and process namespaces.
        # Source routing leaves Core API/Diameter pod-network traffic unchanged.
        - name: troubleshoot
          image: {{ .Values.troubleshooting.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_ADMIN, NET_RAW]}
          command: [/bin/bash, -ec]
          args:
            - |
              {{- if .Values.internetRoute.enabled }}
              ip route replace default via {{ .Values.internetRoute.gateway }} dev net2 table 200
              ip rule show | grep -Fq 'from {{ .Values.internetRoute.uePool }} lookup 200' || ip rule add priority 1200 from {{ .Values.internetRoute.uePool }} table 200
              {{- end }}
              exec sleep infinity
          resources:
            {{- toYaml .Values.troubleshooting.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
        {{- end }}
      volumes:
        - name: input
          configMap: {name: ella-core-lab}
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: bpf
          hostPath: {path: /sys/fs/bpf, type: Directory}
