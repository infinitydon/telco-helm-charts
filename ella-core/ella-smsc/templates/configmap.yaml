{{- if ne (default "internet-ims-sms" (.Values.global | default dict).mode) "internet" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ella-smsc.name" . }}
  labels:
    {{- include "ella-smsc.labels" . | nindent 4 }}
data:
  config.yaml: |
    logging:
      level: {{ .Values.logging.level }}
    db:
      path: /data/smsc.db
    api:
      address: 0.0.0.0
      port: {{ .Values.api.port }}
    diameter:
      address: {{ tpl (default "__POD_IP__" .Values.diameter.address) . | quote }}
      port: {{ .Values.diameter.port }}

{{- end }}
