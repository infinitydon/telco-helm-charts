apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ella.name" . }}
  labels:
    {{- include "ella.labels" . | nindent 4 }}
data:
  config.yaml: |
    logging:
      level: {{ .Values.logging.level }}
    db:
      path: /data/smsc.db
    api:
      address: 0.0.0.0
      port: {{ .Values.api.port }}
    diameter:
      address: {{ default "__POD_IP__" .Values.diameter.address | quote }}
      port: {{ .Values.diameter.port }}
