{{- if ne (default "internet-ims-sms" (.Values.global | default dict).mode) "internet" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-smsc.name" . }}
  labels:
    {{- include "ella-smsc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ella-smsc.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-smsc.name" . }}-diameter
  labels:
    {{- include "ella-smsc.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ella-smsc.selector" . | nindent 4 }}
  ports:
    - name: diameter
      port: {{ .Values.diameter.port }}
      targetPort: diameter
      protocol: SCTP

{{- end }}
