apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ella.name" . }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: api
      image: {{ .Values.initImage | quote }}
      command: [sh, -ec]
      args:
        - wget -qO /dev/null http://{{ include "ella.name" . }}:{{ .Values.api.port }}/api/v1/openapi.yaml
