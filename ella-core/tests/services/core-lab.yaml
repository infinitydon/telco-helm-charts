apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ella-ran
spec:
  config: '{"cniVersion":"0.3.1","type":"bridge","bridge":"ella-test-ran","ipam":{"type":"host-local","subnet":"10.204.0.0/24"}}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ella-core-lab
data:
  core.yaml: |
    logging:
      system: {level: info, output: stdout}
      audit: {output: stdout}
    db:
      path: /data/core.db
    interfaces:
      n2: {address: __POD_IP__}
      n3: {name: net1}
      n6: {name: net2}
      api: {address: 0.0.0.0, port: 5002}
      diameter: {address: __POD_IP__}
    datapath:
      attach-mode: tcx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ella-core-lab
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ella-core-lab}
  template:
    metadata:
      labels: {app: ella-core-lab}
      annotations:
        k8s.v1.cni.cncf.io/networks: ella-ran,ella-n6-core
    spec:
      nodeSelector:
        kubernetes.io/hostname: ebpf-bng-node-01
      automountServiceAccountToken: false
      initContainers:
        - name: config
          image: busybox:1.37.0
          command: [sh, -ec]
          args: ['sed "s/__POD_IP__/${POD_IP}/g" /input/core.yaml > /config/core.yaml']
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          volumeMounts:
            - {name: input, mountPath: /input}
            - {name: config, mountPath: /config}
      containers:
        - name: core
          image: ghcr.io/ellanetworks/ella-core@sha256:89fd9b01308cef5127606ac1073b43e0f5d31724acae61e0ee0d3dbac5c91367
          command: [core, --config, /config/core.yaml]
          securityContext: {privileged: true}
          readinessProbe:
            httpGet: {path: /api/v1/status, port: 5002}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /data}
            - {name: bpf, mountPath: /sys/fs/bpf}
      volumes:
        - name: input
          configMap: {name: ella-core-lab}
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: bpf
          hostPath: {path: /sys/fs/bpf, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: ella-core-lab
spec:
  selector: {app: ella-core-lab}
  ports:
    - {name: http, port: 5002}
