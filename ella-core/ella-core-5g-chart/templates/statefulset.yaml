{{- $svc := include "ella-core.name" . }}
{{- $ns := include "ella-core.namespace" . }}
{{- $replicas := .Values.statefulset.replicas | int }}
{{- $apiPort := .Values.api.port | int }}
{{- $raftPort := .Values.raft.port | int }}
{{- $n2Port := .Values.n2.port | int }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $svc }}
  labels:
    {{- include "ella-core.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ $svc }}
  replicas: {{ $replicas }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "ella-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ella-core.selectorLabels" . | nindent 8 }}
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name": "core-n2", "namespace": "{{ $ns }}", "interface": "n2"},
            {"name": "core-n3", "namespace": "{{ $ns }}", "interface": "n3"},
            {"name": "core-n6", "namespace": "{{ $ns }}", "interface": "n6"}
          ]
    spec:
      terminationGracePeriodSeconds: 60
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "ella-core.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      initContainers:
      - name: config-gen
        image: alpine:3.21.7
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache iproute2
          /scripts/init.sh
        volumeMounts:
        - name: init-script
          mountPath: /scripts
        - name: config
          mountPath: /config
        - name: join-tokens
          mountPath: /tmp/join-tokens
          readOnly: true
      containers:
      - name: core
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["core"]
        args: ["--config", "/config/core.yaml"]
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_RAWIO
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: {{ $apiPort }}
          name: api
          protocol: TCP
        - containerPort: {{ $raftPort }}
          name: raft
          protocol: TCP
        - containerPort: {{ $n2Port }}
          name: n2
          protocol: SCTP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /core/data
        startupProbe:
          httpGet:
            path: /api/v1/status
            port: api
            scheme: HTTP
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: api
            scheme: HTTP
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: api
            scheme: HTTP
          periodSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: init-script
        configMap:
          name: {{ $svc }}-init-script
          defaultMode: 0755
      - name: join-tokens
        projected:
          sources:
          {{- range $podIdx := until $replicas }}
          {{- if ne $podIdx 0 }}
          {{- $nodeID := add1 $podIdx }}
          - secret:
              name: {{ $svc }}-join-token-{{ $nodeID }}
              items:
              - key: token
                path: node-{{ $nodeID }}
              optional: true
          {{- end }}
          {{- end }}
      - name: config
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
