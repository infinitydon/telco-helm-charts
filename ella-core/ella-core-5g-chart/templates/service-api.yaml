apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-core.serviceName" . }}-api
  labels:
    {{- include "ella-core.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ella-core.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.api.port }}
      targetPort: api
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: n2
      port: {{ .Values.n2.port }}
      targetPort: n2
      protocol: SCTP
