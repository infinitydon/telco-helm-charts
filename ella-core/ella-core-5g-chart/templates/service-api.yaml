apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-core.serviceName" . }}-api
  labels:
    {{- include "ella-core.selectorLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ella-core.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.api.port }}
      targetPort: api
      protocol: TCP
      {{- if and (has .Values.service.type (list "NodePort" "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: n2
      port: {{ .Values.n2.port }}
      targetPort: n2
      protocol: SCTP
