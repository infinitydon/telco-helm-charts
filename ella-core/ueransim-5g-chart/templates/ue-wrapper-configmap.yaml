apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ueransim.name" . }}-ue-wrapper
  labels:
    {{- include "ueransim.selectorLabels" . | nindent 4 }}
data:
  wrapper.sh: |
    #!/bin/bash
    set -e

    CONFIG="/config/ue.yaml"
    GENERATION_FILE="/shared/leader-gen"

    # Wait for sidecar to write the initial generation
    echo "Waiting for leader generation from sidecar..."
    while [ ! -s "${GENERATION_FILE}" ]; do
      sleep 1
    done
    CURRENT_GEN=$(cat "${GENERATION_FILE}")
    echo "Initial generation: ${CURRENT_GEN}"

    echo "Starting nr-ue"
    /ueransim/nr-ue -c "${CONFIG}" &
    UE_PID=$!

    cleanup() {
      echo "Received shutdown signal, stopping UE..."
      kill "${UE_PID}" 2>/dev/null || true
      wait "${UE_PID}" 2>/dev/null || true
      echo "UE stopped."
      exit 0
    }
    trap cleanup SIGTERM SIGINT

    # Watch for leader changes (generation increments)
    GNB_SVC="{{ include "ueransim.name" . }}-gnb"
    while true; do
      sleep 5
      if [ -s "${GENERATION_FILE}" ]; then
        NEW_GEN=$(cat "${GENERATION_FILE}")
        if [ "${NEW_GEN}" != "${CURRENT_GEN}" ]; then
          echo "$(date -Iseconds) Leader change detected (gen ${CURRENT_GEN} -> ${NEW_GEN})"
          CURRENT_GEN="${NEW_GEN}"

          # Kill current UE, then wait for gNB health port before restarting
          kill "${UE_PID}" 2>/dev/null || true
          wait "${UE_PID}" 2>/dev/null || true

          echo "Waiting for gNB readiness on ${GNB_SVC}:9999..."
          for i in $(seq 1 30); do
            if timeout 1 bash -c "echo >/dev/tcp/${GNB_SVC}/9999" 2>/dev/null; then
              echo "  gNB ready (attempt ${i})"
              break
            fi
            sleep 1
          done

          /ueransim/nr-ue -c "${CONFIG}" &
          UE_PID=$!
          echo "UE restarted"
        fi
      fi
    done
