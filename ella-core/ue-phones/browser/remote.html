<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#screen{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#status{position:absolute;top:40%;text-align:center;width:100%;font:13px system-ui;color:#47624f}</style></head><body><div id="status">Connecting to your UE browser…</div><div id="screen"></div><script type="module">import RFB from './core/rfb.js';const url=new URL('./websockify',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';const rfb=new RFB(document.getElementById('screen'),url.href);rfb.scaleViewport=true;rfb.resizeSession=false;rfb.focusOnClick=true;rfb.addEventListener('connect',()=>document.getElementById('status').hidden=true);rfb.addEventListener('disconnect',()=>{document.getElementById('status').hidden=false;document.getElementById('status').textContent='Browser disconnected. Reopen the Browser tab to reconnect.'});</script></body></html>
