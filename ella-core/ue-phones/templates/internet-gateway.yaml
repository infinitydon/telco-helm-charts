{{- if .Values.internetGateway.enabled }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Release.Name }}-internet
spec:
  config: {{ dict "cniVersion" "0.3.1" "type" "bridge" "bridge" .Values.internetGateway.bridge "ipam" (dict "type" "static" "addresses" (list (dict "address" .Values.internetGateway.address))) | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-internet
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: ue-internet
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ue-internet
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ printf "%s-internet" .Release.Name | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: router
          image: {{ default (printf "%s:%s" .Values.image.repository .Values.image.tag) .Values.internetGateway.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {privileged: true}
          command: [/bin/bash, -ec]
          args:
            - |
              sysctl -w net.ipv4.ip_forward=1
              ip route replace {{ .Values.internetGateway.uePool }} via {{ .Values.internetGateway.coreAddress }} dev net1
              iptables -t nat -A POSTROUTING -s {{ .Values.internetGateway.uePool }} -o eth0 -j MASQUERADE
              # Core's built-in NAT may already translate the UE source to N6.
              iptables -t nat -A POSTROUTING -s {{ .Values.internetGateway.coreAddress }}/32 -o eth0 -j MASQUERADE
              iptables -A FORWARD -i net1 -o eth0 -j ACCEPT
              iptables -A FORWARD -i eth0 -o net1 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              ethtool -K net1 tx off
              exec sleep infinity
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
{{- end }}
