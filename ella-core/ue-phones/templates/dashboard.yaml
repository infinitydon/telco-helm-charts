{{- range $index, $phone := .Values.phones }}
{{- $n2n3Address := "" }}
{{- if $.Values.n2n3Address }}{{- $addresses := splitList "," (tpl $.Values.n2n3Address $) }}{{- $n2n3Address = index $addresses $index }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $phone.name }}
  labels: {app.kubernetes.io/name: ue-phones, app.kubernetes.io/instance: {{ $.Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, ella-phone: {{ $phone.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ue-phones, app.kubernetes.io/instance: {{ $.Release.Name }}, ella-phone: {{ $phone.name }}}
      {{- if $.Values.networkAttachment }}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ tpl $.Values.networkAttachment $ | quote }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if $.Values.waitForBootstrap.enabled }}
      serviceAccountName: {{ $.Release.Name }}-phones-wait
      initContainers:
        - name: wait-provisioning
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          command: [sh, -ec]
          args:
            - |
              for i in $(seq 1 300); do
                result=$(curl -fsS --max-time 5 --cacert /access/ca.crt -H "Authorization: Bearer $(cat /access/token)" --get \
                  --data-urlencode 'labelSelector=app.kubernetes.io/name=ella-core-bootstrap,app.kubernetes.io/instance={{ $.Release.Name }},ella-revision={{ $.Release.Revision }},ella-mode={{ default $.Values.mode ($.Values.global | default dict).mode }}' \
                  'https://kubernetes.default.svc/apis/batch/v1/namespaces/{{ $.Release.Namespace }}/jobs')
                if echo "$result" | jq -e 'any(.items[]; (.status.succeeded // 0) > 0)' >/dev/null; then
                  core=$(curl -fsS --max-time 5 --cacert /access/ca.crt -H "Authorization: Bearer $(cat /access/token)" \
                    'https://kubernetes.default.svc/apis/apps/v1/namespaces/{{ $.Release.Namespace }}/statefulsets/{{ $.Release.Name }}-core')
                  echo "$core" | jq -e '.status.currentRevision == .status.updateRevision and .status.readyReplicas == .spec.replicas and .status.updatedReplicas == .spec.replicas' >/dev/null && exit 0
                fi
                sleep 2
              done
              exit 1
          volumeMounts: [{name: bootstrap-access, mountPath: /access, readOnly: true}]
      {{- end }}
      securityContext: {fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      containers:
        - name: phone
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext: {privileged: true}
          env:
            - {name: UE_MODE, value: {{ default $.Values.mode ($.Values.global | default dict).mode | quote }}}
            - {name: IMS_ADDRESS, value: {{ if hasKey ($.Values.global.network | default dict) "imsAddress" }}{{ $.Values.global.network.imsAddress | quote }}{{ else }}{{ dig "network" "n6" "imsAddress" "10.6.0.5" ($.Values.global | default dict) | quote }}{{ end }}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: N2N3_ADDRESS, value: {{ $n2n3Address | quote }}}
            - {name: N2N3_INTERFACE, value: {{ $.Values.n2n3Interface | quote }}}
            - {name: CORE_N2, value: {{ tpl $.Values.coreN2 $ | quote }}}
            - {name: CORE_N2_ADDRESSES, value: {{ tpl $.Values.coreN2Addresses $ | quote }}}
            - {name: CORE_MEMBER_HOSTS, value: {{ tpl $.Values.coreMemberHosts $ | quote }}}
            - {name: CORE_ACTIVE_HOST, value: {{ tpl $.Values.coreActiveHost $ | quote }}}
            - {name: N3_INTERFACE, value: {{ $.Values.n3Interface | quote }}}
            - {name: PHONE_ID, value: {{ $phone.id | quote }}}
            - {name: PHONE_NAME, value: {{ $phone.label | quote }}}
            - {name: PEER_URL, value: {{ printf "http://%s-%s-ui:%v" $.Release.Name $phone.peer $.Values.service.port | quote }}}
            - {name: GNB_ID, value: {{ $phone.gnbId | quote }}}
            - {name: BROWSER_VIEWER_VERSION, value: {{ $.Values.browser.image.tag | quote }}}
            - {name: BROWSER_ENABLED, value: {{ $.Values.browser.enabled | quote }}}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {exec: {command: [sh, -ec, 'curl -fsS http://127.0.0.1:8080/api/state | jq -e .ready']}, failureThreshold: 60, periodSeconds: 2, timeoutSeconds: 3}
          readinessProbe: {exec: {command: [sh, -ec, 'curl -fsS http://127.0.0.1:8080/api/state | jq -e .ready']}, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts: [{name: tun, mountPath: /dev/net/tun}]
        {{- if $.Values.browser.enabled }}
        - name: browser
          image: "{{ $.Values.browser.image.repository }}:{{ $.Values.browser.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: {drop: [ALL]}
          env:
            - {name: BROWSER_RENDERER_LIMIT, value: {{ $.Values.browser.rendererProcessLimit | quote }}}
          startupProbe:
            exec: {command: [/usr/local/bin/browser-state]}
            timeoutSeconds: 5
            failureThreshold: 90
            periodSeconds: 2
          livenessProbe:
            exec: {command: [/usr/local/bin/browser-state]}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.browser.resources | nindent 12 }}
          volumeMounts: [{name: shm, mountPath: /dev/shm}, {name: browser-profile, mountPath: /home/browser/profile}]
        {{- end }}
      volumes:
        {{- if $.Values.waitForBootstrap.enabled }}
        - name: bootstrap-access
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
        {{- end }}
        - name: tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: browser-profile
          emptyDir: {}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $phone.name }}-ui
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  selector: {app.kubernetes.io/instance: {{ $.Release.Name }}, ella-phone: {{ $phone.name }}}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      {{- if and (has $.Values.service.type (list "NodePort" "LoadBalancer")) $phone.nodePort }}
      nodePort: {{ $phone.nodePort }}
      {{- end }}
{{- end }}
