image:
  repository: localhost/ella-ue-phones
  tag: 0.2.2
  pullPolicy: Never
# Must be a routable Core NGAP address with its SCTP port.
coreN2: 10.1.21.22:38412
networkAttachment: ella-ran
n3Interface: net1
nodeSelector:
  kubernetes.io/hostname: ebpf-bng-node-01
service:
  # ClusterIP, NodePort or LoadBalancer.
  type: NodePort
  port: 8080
  # 0 lets Kubernetes allocate a port. Ignored for ClusterIP.
  nodePort: 30880
  # Provider-specific LoadBalancer annotations can be supplied here.
  annotations: {}
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
internetGateway:
  enabled: true
  # Empty reuses the dashboard image, which includes routing/NAT tools.
  image: ""
  bridge: ella-test-n6
  address: 10.6.0.1/24
  coreAddress: 10.6.0.2
  uePool: 10.45.0.0/16
