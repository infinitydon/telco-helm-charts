{{- $network := include "core.network" . | fromJson }}
{{- if lt (len $network.n6.coreAddresses) (include "core.count" . | int) }}
{{- fail "network.n6.coreAddresses must contain an address for every Core replica" }}
{{- end }}
{{- if and $network.n2n3.enabled (lt (len $network.n2n3.coreInterfaceAddresses) (include "core.count" . | int)) }}
{{- fail "network.n2n3.coreInterfaceAddresses must contain an address for every Core replica" }}
{{- end }}
{{- if and .Values.provisioning.enabled (eq (default "internet" (.Values.global | default dict).mode) "internet-ims-sms") (empty $network.n6.smscAddress) }}
{{- fail "network.n6.smscAddress is required when provisioning IMS/SMSC" }}
{{- end }}
{{- if and (eq .Values.topology "ha") (eq $network.type "bridge") }}
{{- fail "HA requires a shared L2 N6 network (macvlan), not a node-local bridge" }}
{{- end }}

{{- if and (eq .Values.topology "ha") (not .Values.controller.enabled) }}
{{- fail "HA requires the leader Service controller" }}
{{- end }}
{{- $existing := lookup "apps/v1" "StatefulSet" .Release.Namespace (include "core.fullname" .) }}
{{- if $existing }}
{{- $old := index ($existing.metadata.annotations | default dict) "ella.network/topology" }}
{{- if and $old (ne $old .Values.topology) }}
{{- fail "Changing Core topology requires backup, uninstall and an explicit database migration/reset; see README" }}
{{- end }}
{{- end }}
