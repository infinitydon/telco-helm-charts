apiVersion: v1
kind: Pod
metadata:
  name: {{ include "core.fullname" . }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: status
      image: {{ .Values.initImage }}
      command: [sh, -ec]
      args: ['curl -fsS http://{{ include "core.fullname" . }}-active:5002/api/v1/status | jq -e .result.ready']
