{{- $network := include "core.network" . | fromJson }}
{{- $name := include "core.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $name }}-init}
data:
  init.sh: |
    #!/bin/sh
    set -eu
    ordinal=${HOSTNAME##*-}
    n6=$(echo '{{ $network.n6.coreAddresses | toJson }}' | jq -r ".[$ordinal]")
    test "$n6" != null
    ip address replace "$n6" dev net1
    ip link set net1 up
    {{- if $network.n2n3.enabled }}
    {{- if eq .Values.topology "ha" }}
    n2n3=$(echo '{{ $network.n2n3.coreInterfaceAddresses | toJson }}' | jq -r ".[$ordinal]")
    test "$n2n3" != null
    ip address replace "$n2n3" dev net2
    {{- else }}
    for n2n3 in $(echo '{{ $network.n2n3.coreInterfaceAddresses | toJson }}' | jq -r '.[]'); do ip address replace "$n2n3" dev net2; done
    {{- end }}
    ip link set net2 up
    ethtool -K net2 tx off || true
    {{- end }}
    # Complete checksums for same-host macvlan delivery before NIC offload.
    ethtool -K net1 tx off || true
    for iface in eth0 net1 {{ if $network.n2n3.enabled }}net2{{ end }}; do ethtool -K "$iface" gro off gso off tso off || true; done
    tc qdisc replace dev net1 clsact
    tc filter replace dev net1 egress protocol ip pref 10 matchall action csum ip4h and tcp and udp
    ip route replace default via {{ $network.n6.gatewayAddress }} dev net1 table 200
    ip rule show | grep -Fq 'from {{ $network.dnnPools.internet }} lookup 200' || ip rule add priority 1200 from {{ $network.dnnPools.internet }} table 200
    # Announce replacement MACs before accepting user-plane traffic.
    arping -U -c 2 -I net1 "${n6%/*}" || true
    cat > /config/core.yaml <<EOF
    logging:
      system: {level: info, output: stdout}
      audit: {output: stdout}
    db: {path: /data/core.db}
    interfaces:
      {{- if $network.n2n3.enabled }}
      n2: {name: net2}
      n3: {name: net2}
      {{- else }}
      n2: {address: "$POD_IP"}
      n3: {name: eth0}
      {{- end }}
      n6: {name: net1}
      api: {address: "$POD_IP", port: 5002}
      diameter: {address: "$POD_IP"}
    datapath: {attach-mode: tcx}
    {{- if eq .Values.topology "ha" }}
    cluster:
      enabled: true
      bind-address: "$POD_IP:7000"
      advertise-address: "$HOSTNAME.{{ $name }}-peers.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:7000"
    {{- end }}
    EOF
