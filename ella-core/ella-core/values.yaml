global: {}
fullnameOverride: ""
topology: standalone
replicaCount: 3
image: ghcr.io/infinitydon/ellacore@sha256:926206d7e1b4e4d64ef3f9f91211ec5630951f33ae62c33c694fbd4f83d6bf91
pullPolicy: IfNotPresent
imagePullSecrets: []
initImage: ghcr.io/infinitydon/ella-ue-phones:0.4.5
admin:
  existingSecret: ""
  email: lab@example.com
  password: ""
bootstrap:
  enabled: true
  image: python:3.13-alpine
provisioning:
  enabled: false
  reconcileDataNetworks: false
memberDisplayName:
  enabled: true
  # Supported placeholders: {pod} and {namespace}. Keep the rendered name <=63 characters.
  template: "{pod}.{namespace}"
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
service:
  type: ClusterIP
  port: 5002
  nodePort: 0
  annotations: {}
clusterDomain: cluster.local
network:
  type: bridge
  bridge: ella-stack-n6
  master: eth0
  n6:
    # N6/net1 address for each Core Pod, in StatefulSet ordinal order.
    # Standalone needs one address; HA needs one per replica (three by default).
    coreAddresses: [10.6.0.2/24]
    gatewayAddress: 10.6.0.1
    imsAddress: 10.6.0.5
    smscAddress: 10.6.0.6
  dnnPools:
    internet: 10.45.0.0/16
    ims: 10.60.0.0/16
  n2n3:
    enabled: false
    # Shared N2/N3 net2 address for each Core Pod, in ordinal order.
    # Standalone needs one address; HA needs one per replica. N2 and N3 share net2.
    coreInterfaceAddresses: [10.211.0.2/24]
controller:
  enabled: true
  image: ghcr.io/infinitydon/ella-ue-phones:0.4.5
  # Deprecated compatibility switch. Prefer n6Gateway.enabled.
  gatewayEnabled: false
  nodeSelector: {kubernetes.io/arch: amd64}
n6Gateway:
  # Enabling the lab gateway also disables Core NAT during bootstrap.
  enabled: false
  image: ghcr.io/infinitydon/ella-ue-phones:0.4.5
  nodeSelector: {}
nodeSelector: {kubernetes.io/arch: amd64}
affinity: {}
tolerations: []
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 2Gi}
troubleshooting:
  enabled: true
  image: ghcr.io/nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
