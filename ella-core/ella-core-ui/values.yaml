# This chart creates only a Service; it never restarts or deploys Core.
service:
  name: ""
  type: NodePort # ClusterIP, NodePort, LoadBalancer
  port: 5002
  targetPort: 5002
  nodePort: 30502 # 0 requests automatic allocation; ignored for ClusterIP
  annotations: {}
# Must match the labels on the existing Core pods.
selector:
  app: ella-core-lab
