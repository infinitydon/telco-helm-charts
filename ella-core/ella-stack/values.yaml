global:
  mode: internet
  network:
    type: macvlan
    master: eth0
    bridge: ella-stack-n6
    n6:
      # Core N6/net1 addresses in Core StatefulSet ordinal order.
      # Standalone needs one address; HA needs one per Core replica.
      # The gateway, IMS and SMSC use separate addresses on this same subnet.
      coreAddresses: [10.6.0.2/24, 10.6.0.3/24, 10.6.0.4/24]
      gatewayAddress: 10.6.0.1
      imsAddress: 10.6.0.5
      smscAddress: 10.6.0.6
    dnnPools:
      internet: 10.45.0.0/16
      ims: 10.60.0.0/16
    n2n3:
      enabled: true
      # Core's shared N2/N3 net2 addresses in StatefulSet ordinal order.
      # Use one for standalone or one per Core replica for HA. N2 SCTP and N3 GTP-U share net2.
      coreInterfaceAddresses: [10.211.0.2/24, 10.211.0.3/24, 10.211.0.4/24]
      # N2 destination list that UEs/gNBs use when connecting to Core.
      coreN2Addresses: [10.211.0.2, 10.211.0.3, 10.211.0.4]
      phoneAddresses: [10.211.0.20/24, 10.211.0.21/24]
      ueransimAddress: 10.211.0.30/24
      packetrusherAddress: 10.211.0.31/24
core:
  topology: standalone
  network:
    n2n3:
      enabled: true
  provisioning: {enabled: false}
  service: {type: NodePort, nodePort: 30502}
  n6Gateway:
    enabled: false
ims:
  enabled: true
  nodeSelector: {kubernetes.io/arch: amd64}
  podAnnotations:
    k8s.v1.cni.cncf.io/networks: '{{ .Release.Name }}-core-n6'
  sip:
    addresses: ['{{ if hasKey .Values.global.network `imsAddress` }}{{ .Values.global.network.imsAddress }}{{ else }}{{ .Values.global.network.n6.imsAddress }}{{ end }}']
    trustedNetworks: ['{{ if hasKey .Values.global.network `imsPool` }}{{ .Values.global.network.imsPool }}{{ else }}{{ .Values.global.network.dnnPools.ims }}{{ end }}']
  extraInitContainers:
    - name: n6-route
      image: ghcr.io/infinitydon/ella-ue-phones:0.4.5
      securityContext: {capabilities: {add: [NET_ADMIN, NET_RAW]}}
      command: [sh, -ec]
      args:
        - |
          ip address replace {{ if hasKey .Values.global.network `imsAddress` }}{{ .Values.global.network.imsAddress }}{{ else }}{{ .Values.global.network.n6.imsAddress }}{{ end }}/{{ if hasKey .Values.global.network `coreAddresses` }}{{ first .Values.global.network.coreAddresses | splitList "/" | last }}{{ else }}{{ first .Values.global.network.n6.coreAddresses | splitList "/" | last }}{{ end }} dev net1
          ip link set net1 up
          ip route replace {{ if hasKey .Values.global.network `imsPool` }}{{ .Values.global.network.imsPool }}{{ else }}{{ .Values.global.network.dnnPools.ims }}{{ end }} via {{ if hasKey .Values.global.network `gateway` }}{{ .Values.global.network.gateway }}{{ else }}{{ .Values.global.network.n6.gatewayAddress }}{{ end }} dev net1
          # macvlan may retain parent TX offload despite ethtool; complete TCP/UDP
          # checksums before user-plane packets are copied into a simulated TUN.
          ethtool -K net1 tx off || true
          tc qdisc replace dev net1 clsact
          tc filter replace dev net1 egress protocol ip pref 10 matchall action csum ip4h and tcp and udp
          arping -U -c 2 -I net1 {{ if hasKey .Values.global.network `imsAddress` }}{{ .Values.global.network.imsAddress }}{{ else }}{{ .Values.global.network.n6.imsAddress }}{{ end }} || true
smsc:
  enabled: true
  diameter:
    # Core stores the SMSC Diameter peer as an address, so use a stable
    # N6 Multus address rather than resolving the SMSC Pod's eth0 address.
    address: '{{ if hasKey .Values.global.network "smscAddress" }}{{ .Values.global.network.smscAddress }}{{ else }}{{ .Values.global.network.n6.smscAddress }}{{ end }}'
  podAnnotations:
    k8s.v1.cni.cncf.io/networks: '{{ .Release.Name }}-core-n6'
  extraInitContainers:
    - name: n6-address
      image: ghcr.io/infinitydon/ella-ue-phones:0.4.6
      securityContext: {capabilities: {add: [NET_ADMIN]}}
      command: [sh, -ec]
      args:
        - |
          {{ if hasKey .Values.global.network `coreAddresses` }}prefix={{ first .Values.global.network.coreAddresses | splitList "/" | last }}{{ else }}prefix={{ first .Values.global.network.n6.coreAddresses | splitList "/" | last }}{{ end }}
          {{ if hasKey .Values.global.network `smscAddress` }}ip address replace {{ .Values.global.network.smscAddress }}/$prefix dev net1{{ else }}ip address replace {{ .Values.global.network.n6.smscAddress }}/$prefix dev net1{{ end }}
          ip link set net1 up
phones:
  enabled: false
  image:
    repository: ghcr.io/infinitydon/ella-ue-phones
    tag: 0.4.6
  mode: internet
  waitForBootstrap: {enabled: true}
  networkAttachment: '[{"name":"{{ .Release.Name }}-core-n2n3","interface":"net1"}]'
  coreN2: '{{ first .Values.global.network.n2n3.coreN2Addresses }}:38412'
  coreN2Addresses: '{{ join "," .Values.global.network.n2n3.coreN2Addresses }}'
  coreMemberHosts: '{{ list (printf "%s-core-0.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) (printf "%s-core-1.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) (printf "%s-core-2.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) | join "," }}'
  coreActiveHost: '{{ printf "%s-core-active.%s.svc.%s" .Release.Name .Release.Namespace .Values.core.clusterDomain }}'
  n2n3Address: '{{ join "," .Values.global.network.n2n3.phoneAddresses }}'
  n2n3Interface: net1
  n3Interface: net1
  nodeSelector: {kubernetes.io/arch: amd64}
  internetGateway: {enabled: false}
tester:
  enabled: false
  image: ghcr.io/infinitydon/ella-services-tester:c7cf03530e52-tools1
ueransim:
  enabled: false
  waitForBootstrap: {enabled: true}
  core: {host: '{{ .Release.Name }}-core-active'}
  networkAttachment: '[{"name":"{{ .Release.Name }}-core-n2n3","interface":"net1"}]'
  n2n3Address: '{{ .Values.global.network.n2n3.ueransimAddress }}'
  coreN2Addresses: '{{ join "," .Values.global.network.n2n3.coreN2Addresses }}'
  coreMemberHosts: '{{ list (printf "%s-core-0.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) (printf "%s-core-1.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) (printf "%s-core-2.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) | join "," }}'
packetrusher:
  enabled: false
  waitForBootstrap: {enabled: true}
  core: {host: '{{ .Release.Name }}-core-active'}
  networkAttachment: '[{"name":"{{ .Release.Name }}-core-n2n3","interface":"net1"}]'
  n2n3Address: '{{ .Values.global.network.n2n3.packetrusherAddress }}'
  coreN2Addresses: '{{ join "," .Values.global.network.n2n3.coreN2Addresses }}'
  coreMemberHosts: '{{ list (printf "%s-core-0.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) (printf "%s-core-1.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) (printf "%s-core-2.%s-core-peers.%s.svc.%s" .Release.Name .Release.Name .Release.Namespace .Values.core.clusterDomain) | join "," }}'
